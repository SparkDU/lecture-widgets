<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>감쇠상수와 위상상수 · 전자기학 2</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.1rem 0.9rem 2rem;
    background: #ffffff; color: #333333;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo",
                 "Noto Sans KR", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header { max-width: 720px; margin: 0 auto 0.9rem; }
  h1 { font-size: 1.12rem; line-height: 1.4; margin: 0 0 0.15rem; color: #0b3050; }
  .과목 { font-size: 0.8rem; color: #8a8a8a; }
  main { max-width: 720px; margin: 0 auto; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  /* 🔴 가로로 긴 위젯은 폰 폭(375px)에 넣으면 6배 축소돼 글자가 안 읽힌다
     (실측 2026-09-05, 모바일 에뮬레이션). ⇒ 최소 폭을 두고 좌우로 밀게 한다.
     위젯의 클릭 좌표는 getBoundingClientRect() 로 계산하므로 스크롤과 무관하다. */
  .캔버스틀 { overflow-x: auto; -webkit-overflow-scrolling: touch;
              margin: 0 -0.9rem; padding: 0 0.9rem; }
  .안내 { max-width: 720px; margin: 0 auto 0.7rem; font-size: 0.78rem;
          color: #8a6d3b; background: #fdf7e7; border-left: 3px solid #E69F00;
          padding: 0.45rem 0.7rem; border-radius: 3px; }
  @media (min-width: 760px) { .안내 { display: none; } }
  footer {
    max-width: 720px; margin: 2rem auto 0; padding-top: 0.8rem;
    border-top: 1px solid #e5e5e5;
    font-size: 0.72rem; color: #9a9a9a; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
<header>
<h1>감쇠상수와 위상상수</h1>
<div class="과목">전자기학 2</div>
</header>

<main>
<div style="text-align:center">
<svg id="약해지는파" data-widget viewBox="0 0 560 348" role="img" aria-label="z 방향으로 나아가며 크기가 줄어드는 전기장의 곡선. 크기를 나타내는 점선 두 개 사이에서 곡선이 움직이는 그림" style="display:block;width:100%;max-width:620px;margin:0 auto"></svg>
<div id="약해지는파-조작"></div>
</div>

<script>
(function () {
  'use strict';
  var svg = document.getElementById('약해지는파'), bar = document.getElementById('약해지는파-조작');
  if (!svg || !bar || !svg.createSVGPoint) return;

  var ALPHA = 0.672;
  function physics(z, t) {
    var env = Math.exp(-ALPHA * z);
    return { env: env, Ex: env * Math.cos(2 * Math.PI * (t - z)) };
  }

  function step(t, dt, speed) {
    return t + Math.max(0, Math.min(0.1, dt)) * speed;
  }

  var NS = 'http://www.w3.org/2000/svg';
  var BLUE = '#0072B2', ORANGE = '#E69F00', INK = '#1c1c1c', GREY = '#777';
  var SERIF = '"Times New Roman", "Nimbus Roman", serif';
  var SANS = '"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif';

  var ZX = 104, Y0 = 160, AMP = 112, LAM = 94, ZMAX = 4.5;
  function zx(z) { return ZX + LAM * z; }
  function gy(v) { return Y0 - AMP * v; }

  function el(tag, at, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in at) e.setAttribute(k, at[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  function label(x, y, parts, at) {
    var t = el('text', Object.assign({ x: x, y: y, 'font-size': 19, fill: INK, 'font-family': SERIF }, at || {}));
    var shift = 0;
    parts.forEach(function (pt) {
      var kind = pt.charAt(0), str = pt.slice(2), a = {}, want = kind === 's' ? 5 : (kind === 'p' ? -8 : 0);
      if (want !== shift) { a.dy = want - shift; shift = want; }
      if (kind === 'i' || kind === 's' || kind === 'p') a['font-style'] = 'italic';
      if (kind === 's' || kind === 'p') a['font-size'] = '74%';
      if (str.charAt(0) === '#') { str = str.slice(1); a['font-style'] = 'normal'; }
      var ts = el('tspan', a, t); ts.textContent = str;
    });
    return t;
  }
  function line(a, b, at) { return el('line', Object.assign({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, at)); }
  function head(a, b, size) {
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, w = size * 0.42;
    return 'M' + b[0].toFixed(1) + ' ' + b[1].toFixed(1) +
      'L' + (b[0] - ux * size - uy * w).toFixed(1) + ' ' + (b[1] - uy * size + ux * w).toFixed(1) +
      'L' + (b[0] - ux * size + uy * w).toFixed(1) + ' ' + (b[1] - uy * size - ux * w).toFixed(1) + 'Z';
  }

  var XEND = zx(ZMAX) + 26, axis = { stroke: INK, 'stroke-width': 1.4 };
  line([ZX - 14, Y0], [XEND, Y0], axis); el('path', { d: head([ZX, Y0], [XEND, Y0], 11), fill: INK });
  label(XEND - 2, Y0 + 26, ['i:z'], { 'text-anchor': 'middle' });
  line([ZX, Y0 + 150], [ZX, 22], axis); el('path', { d: head([ZX, Y0], [ZX, 22], 11), fill: INK });
  label(ZX - 10, 30, ['i:E', 's:x'], { 'text-anchor': 'end' });

  var up = '', dn = '', i, z, e;
  for (i = 0; i <= 200; i++) {
    z = ZMAX * i / 200; e = physics(z, 0).env;
    up += (i ? 'L' : 'M') + zx(z).toFixed(1) + ' ' + gy(e).toFixed(1);
    dn += (i ? 'L' : 'M') + zx(z).toFixed(1) + ' ' + gy(-e).toFixed(1);
  }
  var dash = { fill: 'none', stroke: ORANGE, 'stroke-width': 2, 'stroke-dasharray': '8 5' };
  el('path', Object.assign({ d: up }, dash)); el('path', Object.assign({ d: dn }, dash));
  label(zx(2.0), gy(0.56), ['i:E', 's:x', 's:#0', 'n: ', 'i:e', 'p:#−', 'p:αz'], { fill: '#B87A00' });

  label(ZX - 10, gy(1) + 6, ['i:E', 's:x', 's:#0'], { 'text-anchor': 'end' });
  var Z1 = 1 / ALPHA, Y1 = gy(Math.exp(-1)), dots = { stroke: INK, 'stroke-width': 1, 'stroke-dasharray': '2 3' };
  label(ZX - 10, Y1 + 6, ['n:0.37 ', 'i:E', 's:x', 's:#0'], { 'text-anchor': 'end' });
  line([ZX, Y1], [zx(Z1), Y1], dots); line([zx(Z1), Y1], [zx(Z1), Y0 + 142], dots);
  el('circle', { cx: zx(Z1), cy: Y1, r: 4.5, fill: INK });
  var YD = Y0 + 136;
  line([ZX + 9, YD], [zx(Z1) - 9, YD], { stroke: INK, 'stroke-width': 1.3 });
  el('path', { d: head([zx(Z1), YD], [ZX, YD], 9) + head([ZX, YD], [zx(Z1), YD], 9), fill: INK });
  label(zx(Z1) + 10, YD + 6, ['n:1/', 'i:α']);

  var curve = el('path', { fill: 'none', stroke: BLUE, 'stroke-width': 2.6 });
  function draw(t) {
    var d = '', k, zz;
    for (k = 0; k <= 360; k++) {
      zz = ZMAX * k / 360;
      d += (k ? 'L' : 'M') + zx(zz).toFixed(1) + ' ' + gy(physics(zz, t).Ex).toFixed(1);
    }
    curve.setAttribute('d', d);
  }

  bar.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:2px;font-size:16px;line-height:1.3;color:' + INK + ';font-family:' + SANS;
  function mk(tag, css) { var n = document.createElement(tag); n.style.cssText = css || ''; bar.appendChild(n); return n; }
  var SYM = '<i style="font-family:&quot;Times New Roman&quot;,serif;font-size:112%;font-style:italic">';
  var BTN = 'font:inherit;padding:5px 14px;border:1.5px solid ' + INK + ';background:#fff;color:' + INK + ';border-radius:4px;cursor:pointer;min-width:118px';
  var btn = mk('button', BTN), back = mk('button', BTN);
  btn.type = 'button'; back.type = 'button'; back.textContent = '처음 순간으로';
  var tval = mk('span', 'min-width:96px;text-align:left;font-variant-numeric:tabular-nums');

  var SPEED = 1 / 4;
  var q = new URLSearchParams(location.search);
  var frozen = q.has('t') && isFinite(parseFloat(q.get('t')));
  var t = frozen ? parseFloat(q.get('t')) : 0, playing = false, last = null;

  function show() {
    draw(t);
    tval.innerHTML = SYM + 't</i> = ' + t.toFixed(2) + ' ' + SYM + 'T</i>';
    btn.textContent = playing ? '시간 멈춤' : '시간 흐르게';
  }
  btn.addEventListener('click', function () { playing = !playing; last = null; show(); btn.blur(); });
  back.addEventListener('click', function () { playing = false; t = 0; last = null; show(); back.blur(); });

  function tick(now) {
    if (playing) {
      if (last !== null) t = step(t, (now - last) / 1000, SPEED);
      last = now; show();
    } else last = null;
    requestAnimationFrame(tick);
  }
  svg.__state = function () { return { t: t, playing: playing }; };
  show();
  requestAnimationFrame(tick);
})();
</script>
</main>
<footer>© 2026 박상욱 · MAE Lab., 순천향대학교 전자공학과<br>All rights reserved · 무단 복제·배포를 금합니다</footer>
</body>
</html>
