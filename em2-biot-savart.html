<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>눌러 보기: 점을 찍으면 자계가 나온다 · 전자기학 2</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.1rem 0.9rem 2rem;
    background: #ffffff; color: #333333;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo",
                 "Noto Sans KR", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header { max-width: 720px; margin: 0 auto 0.9rem; }
  h1 { font-size: 1.12rem; line-height: 1.4; margin: 0 0 0.15rem; color: #0b3050; }
  .과목 { font-size: 0.8rem; color: #8a8a8a; }
  main { max-width: 720px; margin: 0 auto; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  /* 🔴 가로로 긴 위젯은 폰 폭(375px)에 넣으면 6배 축소돼 글자가 안 읽힌다
     (실측 2026-09-05, 모바일 에뮬레이션). ⇒ 최소 폭을 두고 좌우로 밀게 한다.
     위젯의 클릭 좌표는 getBoundingClientRect() 로 계산하므로 스크롤과 무관하다. */
  .캔버스틀 { overflow-x: auto; -webkit-overflow-scrolling: touch;
              margin: 0 -0.9rem; padding: 0 0.9rem; }
  .안내 { max-width: 720px; margin: 0 auto 0.7rem; font-size: 0.78rem;
          color: #8a6d3b; background: #fdf7e7; border-left: 3px solid #E69F00;
          padding: 0.45rem 0.7rem; border-radius: 3px; }
  @media (min-width: 760px) { .안내 { display: none; } }
  footer {
    max-width: 720px; margin: 2rem auto 0; padding-top: 0.8rem;
    border-top: 1px solid #e5e5e5;
    font-size: 0.72rem; color: #9a9a9a; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
<header>
<h1>눌러 보기: 점을 찍으면 자계가 나온다</h1>
<div class="과목">전자기학 2</div>
</header>
<p class="안내">폰이라면 <b>가로로 돌리거나</b> 그림을 <b>좌우로 밀어</b> 보세요. 손가락으로 벌리면 확대됩니다.</p>
<main>
<div style="text-align:center">
<div class="캔버스틀"><canvas id="자계시뮬" width="1920" height="1080"
        style="min-width:680px;width:100%;max-width:900px;cursor:crosshair;touch-action:none"></canvas></div>
</div>

<script>
(function () {
  var cv = document.getElementById("자계시뮬");
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext("2d");

  var BLUE = "#0072B2", ORANGE = "#E69F00", GREY = "#9b9b9b", INK = "#333333", LIGHT = "#d9d9d9";
  var SERIF = '"Times New Roman", "Nimbus Roman", serif';

  var FS = 21, RS = 27, CUR = FS;
  var SYM = "italic " + FS + "px " + SERIF, SYMs = "italic 18px " + SERIF, SUB = "italic 14px " + SERIF;
  var NUM = FS + "px " + SERIF, NUMs = "22px " + SERIF;
  var RSYM = "italic " + RS + "px " + SERIF, RNUM = RS + "px " + SERIF;
  var W = 960, H = 540;

  var pr = 1.20, pphi = 35 * Math.PI / 180, pz = 0.80;
  var I = 1.0;
  var RMAX = 2.0, RMIN = 0.30, ZMIN = -1.0, ZMAX = 1.8;
  var SPLIT = 478, PANEL_BOTTOM = 462;

  var Lx = 238, Ly = 222, SL = 84;
  function XL(x) { return Lx + x * SL; }
  function YL(y) { return Ly - y * SL; }

  var ALPHA = 28 * Math.PI / 180, PSI = 28 * Math.PI / 180;
  var EX = [-Math.sin(PSI), Math.cos(PSI) * Math.sin(ALPHA)];
  var EY = [Math.cos(PSI), Math.sin(PSI) * Math.sin(ALPHA)];
  var EZ = [0, -Math.cos(ALPHA)];
  var Ox = 712, Oy = 252, SR = 80;
  function U(x, y, z) { return Ox + SR * (EX[0] * x + EY[0] * y + EZ[0] * z); }
  function V(x, y, z) { return Oy + SR * (EX[1] * x + EY[1] * y + EZ[1] * z); }

  function hlen(r) { return Math.min(0.8 / r, 1.6); }

  function arrow(x0, y0, x1, y1, color, w, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = w; ctx.lineCap = "round";
    var a = Math.atan2(y1 - y0, x1 - x0), h = 4 + w * 1.6;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1 - h * 0.85 * Math.cos(a), y1 - h * 0.85 * Math.sin(a));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - h * Math.cos(a - 0.4), y1 - h * Math.sin(a - 0.4));
    ctx.lineTo(x1 - h * Math.cos(a + 0.4), y1 - h * Math.sin(a + 0.4));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function veclabel(x, y, letter, sub, color) {
    ctx.save();
    ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 1.2;
    ctx.font = "italic " + CUR + "px " + SERIF;
    ctx.fillText(letter, x, y);
    var w = ctx.measureText(letter).width, t = y - CUR * 0.88;
    if (sub) { ctx.font = "italic " + Math.round(CUR * 0.68) + "px " + SERIF; ctx.fillText(sub, x + w + 0.5, y + CUR * 0.24); }
    ctx.beginPath();
    ctx.moveTo(x - 0.5, t); ctx.lineTo(x + w + 2, t);
    ctx.moveTo(x + w - 1.5, t - 2.8); ctx.lineTo(x + w + 2, t);
    ctx.lineTo(x + w - 1.5, t + 2.8);
    ctx.stroke();
    ctx.restore();
  }
  function vecWidth(letter, sub) {
    ctx.font = "italic " + CUR + "px " + SERIF; var w = ctx.measureText(letter).width;
    if (!sub) return w + 2;
    ctx.font = "italic " + Math.round(CUR * 0.68) + "px " + SERIF; return w + 1.5 + ctx.measureText(sub).width;
  }

  function runWidth(parts) {
    var w = 0, i, q;
    for (i = 0; i < parts.length; i++) {
      q = parts[i];
      if (q[0] === "VEC") { w += vecWidth(q[1], q[2]); }
      else if (q[0] === "PAD") { w += q[1]; }
      else { ctx.font = q[1]; w += ctx.measureText(q[0]).width; }
    }
    return w;
  }
  function drawRuns(parts, yy, color, x0) {
    var x = (x0 === undefined) ? (W - runWidth(parts)) / 2 : x0, i, q;
    for (i = 0; i < parts.length; i++) {
      q = parts[i];
      if (q[0] === "VEC") { veclabel(x, yy, q[1], q[2], q[3] || color); x += vecWidth(q[1], q[2]); }
      else if (q[0] === "PAD") { x += q[1]; }
      else {
        ctx.font = q[1]; ctx.fillStyle = q[2] || color;
        ctx.fillText(q[0], x, yy);
        x += ctx.measureText(q[0]).width;
      }
    }
  }

  function drawRunsClamped(parts, x, y, color, xmin, xmax) {
    var w = runWidth(parts);
    x = Math.max(xmin, Math.min(xmax - w, x));
    drawRuns(parts, y, color, x);
  }

  function path3(pts, color, w, dash) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.setLineDash(dash || []);
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], u = U(p[0], p[1], p[2]), v = V(p[0], p[1], p[2]);
      if (i === 0) ctx.moveTo(u, v); else ctx.lineTo(u, v);
    }
    ctx.stroke();
    ctx.restore();
  }
  function circle3(r, z, n) {
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var t = i / n * 2 * Math.PI;
      pts.push([r * Math.cos(t), r * Math.sin(t), z]);
    }
    return pts;
  }
  function hLabel(Hm) {
    return [["VEC", "H", ""], [" = " + Hm.toFixed(3) + " A/m ", NUM], ["VEC", "a", "ϕ"]];
  }

  function drawLeft() {
    var px = pr * Math.cos(pphi), py = pr * Math.sin(pphi);
    var L = hlen(pr), Hm = I / (2 * Math.PI * pr);
    var ax = -Math.sin(pphi), ay = Math.cos(pphi);
    var rx = Math.cos(pphi), ry = Math.sin(pphi);
    ctx.save();

    arrow(XL(-2.4), YL(0), XL(2.4), YL(0), GREY, 1);
    arrow(XL(0), YL(-2.4), XL(0), YL(2.4), GREY, 1);
    ctx.fillStyle = GREY; ctx.font = SYMs;
    ctx.fillText("x", XL(2.47), YL(0) + 6);
    ctx.fillText("y", XL(0) - 17, YL(2.47));

    ctx.setLineDash([3, 4]);
    ctx.strokeStyle = LIGHT; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(Lx, Ly, RMAX * SL, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = BLUE; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(Lx, Ly, pr * SL, 0, 6.2832); ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(XL(0), YL(0)); ctx.lineTo(XL(px), YL(py)); ctx.stroke();
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(Lx, Ly, 0.40 * SL, 0, -pphi, pphi > 0); ctx.stroke();
    ctx.fillStyle = INK; ctx.font = SYM;
    var mh = 0.58 * SL;
    ctx.fillText("ϕ", Lx + mh * Math.cos(pphi / 2) - 5, Ly - mh * Math.sin(pphi / 2) + 6);

    ctx.fillText("ρ", XL(px * 0.78 - 0.2 * ax) - 5, YL(py * 0.78 - 0.2 * ay) + 6);

    arrow(XL(px), YL(py), XL(px + L * ax), YL(py + L * ay), ORANGE, 3.6);
    drawRunsClamped(hLabel(Hm), XL(px + L * ax) - 30, YL(py + L * ay) - 14, ORANGE, 8, SPLIT - 8);

    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(XL(px), YL(py), 4.5, 0, 6.2832); ctx.fill();
    ctx.font = SYMs; ctx.fillText("P", XL(px + 0.20 * rx) - 5, YL(py + 0.20 * ry) + 6);

    ctx.strokeStyle = "#000"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(XL(0), YL(0), 6, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(XL(0), YL(0), 2, 0, 6.2832); ctx.fill();
    ctx.font = SYMs; ctx.fillText("I", XL(0) + 10, YL(0) + 19);
    ctx.font = NUMs; ctx.fillStyle = "#666"; ctx.textAlign = "center";
    ctx.fillText("위에서 본 xy 평면 · 눌러서 위치 정하기", Lx, 458);
    ctx.textAlign = "left";
    ctx.restore();
  }

  function drawRight() {
    var px = pr * Math.cos(pphi), py = pr * Math.sin(pphi);
    var L = hlen(pr), Hm = I / (2 * Math.PI * pr);
    var ax = -Math.sin(pphi), ay = Math.cos(pphi);
    var rx = Math.cos(pphi), ry = Math.sin(pphi);
    ctx.save();

    ctx.fillStyle = "#f2f2f2"; ctx.strokeStyle = LIGHT; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(U(-1.6, -1.6, 0), V(-1.6, -1.6, 0)); ctx.lineTo(U(1.6, -1.6, 0), V(1.6, -1.6, 0));
    ctx.lineTo(U(1.6, 1.6, 0), V(1.6, 1.6, 0)); ctx.lineTo(U(-1.6, 1.6, 0), V(-1.6, 1.6, 0));
    ctx.closePath(); ctx.fill(); ctx.stroke();

    arrow(U(0, 0, 0), V(0, 0, 0), U(2.0, 0, 0), V(2.0, 0, 0), GREY, 1);
    arrow(U(0, 0, 0), V(0, 0, 0), U(0, 2.0, 0), V(0, 2.0, 0), GREY, 1);
    ctx.fillStyle = GREY; ctx.font = SYMs;
    ctx.fillText("x", U(2.2, 0, 0) - 5, V(2.2, 0, 0) + 6);
    ctx.fillText("y", U(0, 2.15, 0), V(0, 2.15, 0) + 6);
    ctx.fillText("z", U(0, 0, 2.1) + 9, V(0, 0, 2.1) + 5);

    ctx.strokeStyle = "#000"; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(U(0, 0, ZMIN - 0.2), V(0, 0, ZMIN - 0.2)); ctx.lineTo(U(0, 0, 2.1), V(0, 0, 2.1)); ctx.stroke();
    arrow(U(0, 0, 1.25), V(0, 0, 1.25), U(0, 0, 1.8), V(0, 0, 1.8), "#000", 2.6);
    ctx.fillStyle = "#000"; ctx.font = SYM; ctx.fillText("I", U(0, 0, 1.55) + 9, V(0, 0, 1.55) + 6);

    path3([[0, 0, 0], [px, py, 0]], INK, 1.4);
    var arc = [];
    for (var i = 0; i <= 24; i++) { var t = pphi * i / 24; arc.push([0.45 * Math.cos(t), 0.45 * Math.sin(t), 0]); }
    path3(arc, INK, 1.2);
    ctx.fillStyle = INK; ctx.font = SYM;
    var mx = 0.72 * Math.cos(pphi / 2), my = 0.72 * Math.sin(pphi / 2);
    ctx.fillText("ϕ", U(mx, my, 0) - 5, V(mx, my, 0) + 6);
    var qx = px * 0.78 - 0.28 * ax, qy = py * 0.78 - 0.28 * ay;
    ctx.fillText("ρ", U(qx, qy, 0) - 5, V(qx, qy, 0) + 6);
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(U(px, py, 0), V(px, py, 0), 3.2, 0, 6.2832); ctx.fill();

    path3([[px, py, 0], [px, py, pz]], INK, 1.2, [3, 3]);
    ctx.fillStyle = INK; ctx.font = SYM;
    ctx.fillText("z", U(px, py, pz / 2) + 7, V(px, py, pz / 2) + 6);

    path3(circle3(pr, pz, 72), BLUE, 1.5, [3, 4]);

    arrow(U(px, py, pz), V(px, py, pz), U(px + L * ax, py + L * ay, pz), V(px + L * ax, py + L * ay, pz), ORANGE, 3.6);
    drawRunsClamped(hLabel(Hm), U(px + L * ax, py + L * ay, pz) - 30, V(px + L * ax, py + L * ay, pz) - 14, ORANGE, SPLIT + 8, W - 8);

    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(U(px, py, pz), V(px, py, pz), 4.8, 0, 6.2832); ctx.fill();

    ctx.font = SYMs; ctx.fillText("P", U(px, py, pz) - 18, V(px, py, pz) - 8);
    ctx.font = NUMs; ctx.fillStyle = "#666"; ctx.textAlign = "center";
    ctx.fillText("입체로 본 같은 점 · 위아래로 끌어 높이", Ox + 8, 458);
    ctx.textAlign = "left";
    ctx.restore();
  }

  function drawReadout() {
    var d = ((Math.round(pphi * 180 / Math.PI) % 360) + 360) % 360;
    var Hm = I / (2 * Math.PI * pr);
    ctx.textAlign = "left"; CUR = RS;
    drawRuns([["ρ", RSYM], [" = " + pr.toFixed(2) + "       ", RNUM],
              ["ϕ", RSYM], [" = " + d.toFixed(0) + "°       ", RNUM],
              ["z", RSYM], [" = " + pz.toFixed(2).replace("-", "−") + "       ", RNUM],
              ["I", RSYM], [" = " + I.toFixed(0) + " A", RNUM]], 494, INK);

    drawRuns([["VEC", "H", ""], [" = ", RNUM], ["I", RSYM], [" / (2π", RNUM], ["ρ", RSYM], [") ", RNUM],
              ["VEC", "a", "ϕ"], ["  =  " + I.toFixed(0) + " / (2π · " + pr.toFixed(2) + ") ", RNUM],
              ["VEC", "a", "ϕ"], ["  =  " + Hm.toFixed(3) + " A/m ", RNUM], ["VEC", "a", "ϕ"]], 532, ORANGE);
    CUR = FS;
  }

  function draw() {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineJoin = "round"; ctx.textAlign = "left";
    ctx.strokeStyle = LIGHT; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(SPLIT, 10); ctx.lineTo(SPLIT, PANEL_BOTTOM); ctx.stroke();
    drawLeft(); drawRight(); drawReadout();
  }

  var mode = null, z0 = 0, v0 = 0;
  function mouse(ev) {
    var rc = cv.getBoundingClientRect();
    return [(ev.clientX - rc.left) / rc.width * W, (ev.clientY - rc.top) / rc.height * H];
  }
  function pickLeft(mx, my) {
    var dx = (mx - Lx) / SL, dy = (Ly - my) / SL;
    var r = Math.sqrt(dx * dx + dy * dy);
    if (r < RMIN) return;

    var deg = Math.round(Math.atan2(dy, dx) * 180 / Math.PI);
    deg = ((deg % 360) + 360) % 360;
    pphi = deg * Math.PI / 180;
    pr = Math.round(Math.min(r, RMAX) * 100) / 100;
    draw();
  }
  function dragZ(my) {

    var z = z0 - (my - v0) / (SR * Math.cos(ALPHA));
    z = Math.max(ZMIN, Math.min(ZMAX, z));
    pz = Math.round(z * 20) / 20;
    draw();
  }
  cv.addEventListener("pointerdown", function (e) {
    var m = mouse(e);
    if (m[0] < SPLIT && m[1] < PANEL_BOTTOM) { mode = "left"; pickLeft(m[0], m[1]); }
    else if (m[0] >= SPLIT && m[1] < PANEL_BOTTOM) { mode = "z"; z0 = pz; v0 = m[1]; }
    else { mode = null; }
    e.preventDefault();
  });
  cv.addEventListener("pointermove", function (e) {
    if (!mode) return;
    var m = mouse(e);
    if (mode === "left") pickLeft(m[0], m[1]); else dragZ(m[1]);
  });
  window.addEventListener("pointerup", function () { mode = null; });

  draw();
  window.addEventListener("load", draw);
})();
</script>
</main>
<footer>© 2026 박상욱 · MAE Lab., 순천향대학교 전자공학과 · 무단 전재·재배포 금지</footer>
</body>
</html>
