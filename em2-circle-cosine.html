<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>원 위에서 도는 벡터와 코사인 · 전자기학 2</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.1rem 0.9rem 2rem;
    background: #ffffff; color: #333333;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo",
                 "Noto Sans KR", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header { max-width: 720px; margin: 0 auto 0.9rem; }
  h1 { font-size: 1.12rem; line-height: 1.4; margin: 0 0 0.15rem; color: #0b3050; }
  .과목 { font-size: 0.8rem; color: #8a8a8a; }
  main { max-width: 720px; margin: 0 auto; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  /* 🔴 가로로 긴 위젯은 폰 폭(375px)에 넣으면 6배 축소돼 글자가 안 읽힌다
     (실측 2026-09-05, 모바일 에뮬레이션). ⇒ 최소 폭을 두고 좌우로 밀게 한다.
     위젯의 클릭 좌표는 getBoundingClientRect() 로 계산하므로 스크롤과 무관하다. */
  .캔버스틀 { overflow-x: auto; -webkit-overflow-scrolling: touch;
              margin: 0 -0.9rem; padding: 0 0.9rem; }
  .안내 { max-width: 720px; margin: 0 auto 0.7rem; font-size: 0.78rem;
          color: #8a6d3b; background: #fdf7e7; border-left: 3px solid #E69F00;
          padding: 0.45rem 0.7rem; border-radius: 3px; }
  @media (min-width: 760px) { .안내 { display: none; } }
  footer {
    max-width: 720px; margin: 2rem auto 0; padding-top: 0.8rem;
    border-top: 1px solid #e5e5e5;
    font-size: 0.72rem; color: #9a9a9a; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
<header>
<h1>원 위에서 도는 벡터와 코사인</h1>
<div class="과목">전자기학 2</div>
</header>

<main>
<div style="text-align:center">
<div style="overflow-x:auto">
<svg id="원과코사인" data-widget viewBox="0 0 960 330" role="img" aria-label="반지름 1 인 원 위에서 벡터가 돌고, 그 세로 성분 y 를 각에 따라 옮겨 그리면 코사인 곡선이 되는 그림" style="display:block;width:100%;max-width:1000px;min-width:680px;margin:0 auto"></svg>
</div>
<div id="원과코사인-조작"></div>
</div>

<script>
(function () {
  'use strict';
  var svg = document.getElementById('원과코사인'), bar = document.getElementById('원과코사인-조작');
  if (!svg || !bar || !svg.createSVGPoint) return;

  function physics(deg) {
    var r = deg * Math.PI / 180, y = Math.cos(r), x = Math.sin(r);
    if (Math.abs(y) < 5e-4) y = 0;
    if (Math.abs(x) < 5e-4) x = 0;
    return { x: x, y: y };
  }

  function snap(deg) { var v = Math.round(Number(deg)) % 360; return v < 0 ? v + 360 : v; }

  function step(deg, dt, speed) {
    var v = deg + Math.max(0, Math.min(0.1, dt)) * speed;
    return v - 360 * Math.floor(v / 360);
  }

  var NS = 'http://www.w3.org/2000/svg';
  var BLUE = '#0072B2', ORANGE = '#E69F00', OTXT = '#9A6A00', INK = '#1c1c1c', GREY = '#777';
  var SERIF = '"Times New Roman", "Nimbus Roman", serif';
  var SANS = '"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif';

  var CX = 160, CY = 160, R = 108, X0 = 380, GW = 500;
  function gx(deg) { return X0 + GW * deg / 360; }
  function gy(v) { return CY - R * v; }

  function el(tag, at, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in at) e.setAttribute(k, at[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  function runs(x, y, parts, at) {
    var t = el('text', Object.assign({ x: x, y: y, 'font-size': 18, fill: INK, 'font-family': SANS }, at || {}));
    parts.forEach(function (p) {
      var s = el('tspan', {}, t); s.textContent = p[0];
      if (p[1] === 'i') { s.setAttribute('font-family', SERIF); s.setAttribute('font-style', 'italic'); s.setAttribute('font-size', '115%'); }
      else if (p[1] === 'r') { s.setAttribute('font-family', SERIF); s.setAttribute('font-size', '112%'); }
    });
    return t;
  }
  function line(a, b, at) { return el('line', Object.assign({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, at)); }
  function setLine(node, a, b) { node.setAttribute('x1', a[0].toFixed(1)); node.setAttribute('y1', a[1].toFixed(1)); node.setAttribute('x2', b[0].toFixed(1)); node.setAttribute('y2', b[1].toFixed(1)); }

  function head(a, b, size) {
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    if (L < size * 1.2) return '';
    var ux = dx / L, uy = dy / L, w = size * 0.42;
    return 'M' + b[0].toFixed(1) + ' ' + b[1].toFixed(1) +
      'L' + (b[0] - ux * size - uy * w).toFixed(1) + ' ' + (b[1] - uy * size + ux * w).toFixed(1) +
      'L' + (b[0] - ux * size + uy * w).toFixed(1) + ' ' + (b[1] - uy * size - ux * w).toFixed(1) + 'Z';
  }

  function shaftEnd(a, b, size, has) {
    if (!has) return b;
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    return [b[0] - dx / L * size * 0.9, b[1] - dy / L * size * 0.9];
  }

  var thin = { stroke: '#bbbbbb', 'stroke-width': 1 }, axis = { stroke: INK, 'stroke-width': 1.4 }, dots = { stroke: GREY, 'stroke-width': 1, 'stroke-dasharray': '3 4' };
  el('circle', { cx: CX, cy: CY, r: R, fill: 'none', stroke: '#999999', 'stroke-width': 1.4 });
  line([CX - R - 22, CY], [CX + R + 22, CY], thin);
  line([CX, CY + R + 22], [CX, CY - R - 22], thin);
  line([X0, CY + R + 14], [X0, CY - R - 26], axis); el('path', { d: head([X0, CY], [X0, CY - R - 26], 11), fill: INK });
  runs(X0 + 10, CY - R - 16, [['y', 'i']], { fill: OTXT, 'font-weight': 700 });
  line([X0, CY], [X0 + GW + 30, CY], axis); el('path', { d: head([X0, CY], [X0 + GW + 30, CY], 11), fill: INK });
  runs(X0 + GW + 36, CY + 6, [['ω', 'i'], ['t', 'i']]);
  [1, -1].forEach(function (v) {
    line([X0, gy(v)], [gx(360), gy(v)], dots);
    runs(X0 - 10, gy(v) + 6, [[(v > 0 ? '' : '−') + '1', 'r']], { 'text-anchor': 'end' });
  });
  [90, 180, 270, 360].forEach(function (d) {
    line([gx(d), gy(1)], [gx(d), gy(-1) + 6], dots);
    runs(gx(d), gy(-1) + 30, [[d + '°', 'n']], { 'text-anchor': 'middle', 'font-size': 16 });
  });
  runs(CX, CY + R + 52, [['y', 'i'], [' = ', 'r'], ['cos ', 'r'], ['ω', 'i'], ['t', 'i']], { 'text-anchor': 'middle', fill: OTXT, 'font-size': 22 });

  var trace = el('path', { fill: 'none', stroke: ORANGE, 'stroke-width': 3 });
  var link = el('line', { stroke: GREY, 'stroke-width': 1.2, 'stroke-dasharray': '5 5' });
  var horiz = el('line', { stroke: GREY, 'stroke-width': 1.2, 'stroke-dasharray': '3 4' });
  var arc = el('path', { fill: 'none', stroke: BLUE, 'stroke-width': 1.4 });
  var angT = runs(0, 0, [['ω', 'i'], ['t', 'i']], { fill: BLUE });
  var vShaft = el('line', { stroke: BLUE, 'stroke-width': 3 });
  var vTip = el('path', { fill: BLUE });
  var oneT = runs(0, 0, [['1', 'r']], { fill: BLUE });
  var yShaft = el('line', { stroke: ORANGE, 'stroke-width': 6 });
  var yTip = el('path', { fill: ORANGE });
  var yT = runs(0, 0, [['y', 'i']], { fill: OTXT, 'font-weight': 700 });
  el('circle', { cx: CX, cy: CY, r: 4.5, fill: INK });
  var pen = el('circle', { r: 6.5, fill: ORANGE, stroke: INK, 'stroke-width': 1 });

  function draw(deg) {
    var p = physics(deg), o = [CX, CY], tipV = [CX + R * p.x, CY - R * p.y], tipY = [CX, CY - R * p.y], i, d, q;
    var hv = head(o, tipV, 15); vTip.setAttribute('d', hv); setLine(vShaft, o, shaftEnd(o, tipV, 15, hv));
    var hy = head(o, tipY, 17); yTip.setAttribute('d', hy); setLine(yShaft, o, shaftEnd(o, tipY, 17, hy));
    yShaft.style.opacity = Math.abs(p.y) < 0.03 ? 0 : 1;
    setLine(horiz, tipY, tipV);
    var r = deg * Math.PI / 180, a0 = 34;
    arc.setAttribute('d', deg < 1 ? '' : 'M' + CX + ' ' + (CY - a0) + ' A' + a0 + ' ' + a0 + ' 0 ' + (deg > 180 ? 1 : 0) + ' 1 ' + (CX + a0 * Math.sin(r)).toFixed(1) + ' ' + (CY - a0 * Math.cos(r)).toFixed(1));
    angT.setAttribute('x', (CX + 54 * Math.sin(r / 2) - 10).toFixed(1)); angT.setAttribute('y', (CY - 54 * Math.cos(r / 2) + 6).toFixed(1));
    angT.style.opacity = deg < 24 ? 0 : 1;
    oneT.setAttribute('x', (CX + 0.55 * R * p.x + 18 * p.y - 5).toFixed(1)); oneT.setAttribute('y', (CY - 0.55 * R * p.y + 18 * p.x + 6).toFixed(1));
    yT.setAttribute('x', p.x >= 0 ? CX - 26 : CX + 12); yT.setAttribute('y', (CY - R * p.y / 2 + 7).toFixed(1));
    yT.style.opacity = Math.abs(p.y) < 0.15 ? 0 : 1;
    d = 'M' + gx(0) + ' ' + gy(1);
    for (i = 1; i <= deg; i++) { q = physics(i); d += 'L' + gx(i).toFixed(1) + ' ' + gy(q.y).toFixed(1); }
    trace.setAttribute('d', d);
    setLine(link, tipV, [gx(deg), tipY[1]]);
    pen.setAttribute('cx', gx(deg).toFixed(1)); pen.setAttribute('cy', tipY[1].toFixed(1));
    return p;
  }

  bar.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:4px;font-size:17px;line-height:1.3;color:' + INK + ';font-family:' + SANS;
  function mk(tag, css) { var e = document.createElement(tag); e.style.cssText = css || ''; bar.appendChild(e); return e; }
  var SYM = '<i style="font-family:&quot;Times New Roman&quot;,serif;font-size:112%;font-style:italic">';
  var btn = mk('button', 'font:inherit;padding:6px 18px;border:1.5px solid ' + INK + ';background:#fff;color:' + INK + ';border-radius:4px;cursor:pointer;min-width:96px');
  btn.type = 'button';
  mk('span').innerHTML = '각 ' + SYM + 'ω</i>' + SYM + 't</i>';
  var slider = mk('input', 'width:300px;accent-color:' + ORANGE);
  slider.type = 'range'; slider.min = 0; slider.max = 359; slider.step = 1;
  slider.setAttribute('aria-label', '각 ωt');
  var val = mk('span', 'min-width:190px;text-align:left;font-variant-numeric:tabular-nums');

  var SPEED = 90;
  var q = new URLSearchParams(location.search);
  var printView = q.get('view') === 'print' || q.has('print-pdf');
  var deg = printView ? 60 : 0, playing = !printView, last = null;

  function fmt(v) { return (v < 0 ? '−' : '') + Math.abs(v).toFixed(2); }
  function show() {
    var s = snap(deg), p = draw(s);
    slider.value = s;
    val.innerHTML = SYM + 'ω</i>' + SYM + 't</i> = ' + s + '°  →  ' + SYM + 'y</i> = ' + fmt(p.y);
    btn.textContent = playing ? '멈춤' : '재생';
  }
  btn.addEventListener('click', function () { playing = !playing; last = null; show(); btn.blur(); });
  slider.addEventListener('input', function () { playing = false; deg = parseFloat(slider.value); show(); });
  slider.addEventListener('change', function () { slider.blur(); });

  function tick(now) {
    if (playing) {
      if (last !== null) deg = step(deg, (now - last) / 1000, SPEED);
      last = now; show();
    } else last = null;
    requestAnimationFrame(tick);
  }
  svg.__state = function () { return { deg: deg, shown: snap(deg), playing: playing }; };
  show();
  requestAnimationFrame(tick);
})();
</script>
</main>
<footer>© 2026 박상욱 · MAE Lab., 순천향대학교 전자공학과<br>All rights reserved · 무단 복제·배포를 금합니다</footer>
</body>
</html>
