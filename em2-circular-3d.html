<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>눌러 보기: 공간에서 본 원형 편파 · 전자기학 2</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.1rem 0.9rem 2rem;
    background: #ffffff; color: #333333;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo",
                 "Noto Sans KR", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header { max-width: 720px; margin: 0 auto 0.9rem; }
  h1 { font-size: 1.12rem; line-height: 1.4; margin: 0 0 0.15rem; color: #0b3050; }
  .과목 { font-size: 0.8rem; color: #8a8a8a; }
  main { max-width: 720px; margin: 0 auto; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  /* 🔴 가로로 긴 위젯은 폰 폭(375px)에 넣으면 6배 축소돼 글자가 안 읽힌다
     (실측 2026-09-05, 모바일 에뮬레이션). ⇒ 최소 폭을 두고 좌우로 밀게 한다.
     위젯의 클릭 좌표는 getBoundingClientRect() 로 계산하므로 스크롤과 무관하다. */
  .캔버스틀 { overflow-x: auto; -webkit-overflow-scrolling: touch;
              margin: 0 -0.9rem; padding: 0 0.9rem; }
  .안내 { max-width: 720px; margin: 0 auto 0.7rem; font-size: 0.78rem;
          color: #8a6d3b; background: #fdf7e7; border-left: 3px solid #E69F00;
          padding: 0.45rem 0.7rem; border-radius: 3px; }
  @media (min-width: 760px) { .안내 { display: none; } }
  footer {
    max-width: 720px; margin: 2rem auto 0; padding-top: 0.8rem;
    border-top: 1px solid #e5e5e5;
    font-size: 0.72rem; color: #9a9a9a; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
<header>
<h1>눌러 보기: 공간에서 본 원형 편파</h1>
<div class="과목">전자기학 2</div>
</header>

<main>
<div style="text-align:center">
<div style="overflow-x:auto">
<svg id="원형편파공간" data-widget viewBox="0 0 960 470" role="img" aria-label="전기장 화살표의 끝이 z 축을 따라 나사선을 이루는 그림. 보는 방향을 바꿀 수 있다" style="display:block;width:100%;max-width:740px;min-width:680px;margin:0 auto"></svg>
</div>
<div id="원형편파공간-조작"></div>
</div>

<script>
(function () {
  'use strict';
  var svg = document.getElementById('원형편파공간'), box = document.getElementById('원형편파공간-조작');
  if (!svg || !box || !svg.createSVGPoint) return;

  function physics(z, t, opt) {
    var th = 2 * Math.PI * (t - z);
    return { Ex: Math.cos(th), Ey: Math.cos(th + opt.phi) };
  }

  function step(t, dt, speed) {
    return t + Math.max(0, Math.min(0.1, dt)) * speed;
  }

  function turnStep(turning, dt, sec) {
    return Math.min(1, turning + Math.max(0, Math.min(0.1, dt)) / sec);
  }

  var ZS = 318 / 92;
  var VIEWS = {
    oblique: { r: [0, -0.40, ZS], p: [1, -0.56, 0] },
    front:   { r: [1, 0, 0],      p: [0, 1, 0] },
    side:    { r: [0, 0, ZS],     p: [1, 0, 0] },
    top:     { r: [0, 0, ZS],     p: [0, 1, 0] }
  };
  function mix(a, b, k) {
    return { r: [a.r[0] + (b.r[0] - a.r[0]) * k, a.r[1] + (b.r[1] - a.r[1]) * k, a.r[2] + (b.r[2] - a.r[2]) * k],
             p: [a.p[0] + (b.p[0] - a.p[0]) * k, a.p[1] + (b.p[1] - a.p[1]) * k, a.p[2] + (b.p[2] - a.p[2]) * k] };
  }
  function ease(k) { return k * k * (3 - 2 * k); }

  function project(f, x, y, z) {
    var w = z - 1;
    return [f.r[0] * x + f.r[1] * y + f.r[2] * w, f.p[0] * x + f.p[1] * y + f.p[2] * w];
  }

  var NS = 'http://www.w3.org/2000/svg';
  var BLUE = '#0072B2', ORANGE = '#E69F00', INK = '#1c1c1c', GREY = '#555';
  var SERIF = '"Times New Roman", "Nimbus Roman", serif';
  var SANS = '"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif';
  var CX = 468, CY = 262, A = 92, Z0 = 1;
  var cur = VIEWS.oblique;
  function P(x, y, z) { var q = project(cur, x, y, z); return [CX + A * q[0], CY - A * q[1]]; }

  function el(tag, at, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in at) e.setAttribute(k, at[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  function fill(t, s) {
    while (t.firstChild) t.removeChild(t.firstChild);
    var re = /_\{([a-z]*)([0-9]*)\}|(cos|sin)|([A-Za-zωλη]+)|([^A-Za-zωλη_]+|_)/g, m, drop = false;
    function span(str, a) { var ts = el('tspan', a, t); ts.textContent = str; }
    while ((m = re.exec(s))) {
      if (m[1] !== undefined) {
        var first = true;
        if (m[1]) { span(m[1], { 'font-size': '76%', dy: 5, 'font-family': SERIF, 'font-style': 'italic' }); first = false; }
        if (m[2]) span(m[2], first ? { 'font-size': '76%', dy: 5, 'font-family': SERIF } : { 'font-size': '76%', 'font-family': SERIF });
        drop = true; continue;
      }
      var a = drop ? { dy: -5 } : {};
      if (m[4] !== undefined) { a['font-family'] = SERIF; a['font-style'] = 'italic'; a['font-size'] = '112%'; }
      span(m[0], a); drop = false;
    }
    return t;
  }
  function text(x, y, s, at, parent) {
    return fill(el('text', Object.assign({ x: x, y: y, 'font-size': 17, fill: INK, 'font-family': SANS }, at || {}), parent), s);
  }
  function head(a, b, size) {
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    if (L < size * 1.2) return '';
    var ux = dx / L, uy = dy / L, w = size * 0.42;
    return 'M' + b[0].toFixed(1) + ' ' + b[1].toFixed(1) +
      'L' + (b[0] - ux * size - uy * w).toFixed(1) + ' ' + (b[1] - uy * size + ux * w).toFixed(1) +
      'L' + (b[0] - ux * size + uy * w).toFixed(1) + ' ' + (b[1] - uy * size - ux * w).toFixed(1) + 'Z';
  }
  function pathOf(pts) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(''); }
  function setLine(node, a, b) { node.setAttribute('x1', a[0].toFixed(1)); node.setAttribute('y1', a[1].toFixed(1)); node.setAttribute('x2', b[0].toFixed(1)); node.setAttribute('y2', b[1].toFixed(1)); }

  var plane = el('path', { fill: '#0072B2', 'fill-opacity': 0.06, stroke: GREY, 'stroke-width': 1 });
  var ring = el('path', { fill: 'none', stroke: INK, 'stroke-width': 1.3, 'stroke-dasharray': '3 3' });
  var planeText = text(0, 0, 'z = λ 인 평면: 시간이 흐르면 주황 화살표의 끝이 원을 그림', { 'font-size': 16 });
  var axes = {};
  ['z', 'x', 'y'].forEach(function (k) {
    axes[k] = { line: el('line', { stroke: INK, 'stroke-width': 1.4 }), head: el('path', { fill: INK }), text: text(0, 0, k) };
  });
  var goText = text(0, 0, '진행 방향');

  var gComp = el('g', {});
  el('line', { x1: 250, y1: 26, x2: 294, y2: 26, stroke: BLUE, 'stroke-width': 3.2 });
  text(304, 32, '전기장 (두 성분의 합)');
  var legend = el('g', {}, gComp);
  el('line', { x1: 250, y1: 54, x2: 294, y2: 54, stroke: GREY, 'stroke-width': 2 }, legend);
  text(304, 60, 'E_{x} = E_{0} cos(ωt − k_{0}z)', {}, legend);
  el('line', { x1: 560, y1: 54, x2: 604, y2: 54, stroke: ORANGE, 'stroke-width': 2, 'stroke-dasharray': '8 5' }, legend);
  var eyText = text(614, 60, '', {}, legend);

  var turnArc = el('path', { fill: 'none', stroke: INK, 'stroke-width': 2.2 });
  var turnHead = el('path', { fill: INK });
  var compX = el('path', { fill: 'none', stroke: GREY, 'stroke-width': 1.6 }, gComp);
  var compY = el('path', { fill: 'none', stroke: ORANGE, 'stroke-width': 1.8, 'stroke-dasharray': '8 5', opacity: 0.9 }, gComp);
  var helix = el('path', { fill: 'none', stroke: BLUE, 'stroke-width': 2.8 });
  var gArrows = el('g', {});
  var N = 32, arrows = [], heads = el('path', { fill: BLUE }, gArrows);
  for (var i = 0; i <= N; i++) arrows.push(el('line', { stroke: BLUE, 'stroke-width': 1.5 }, gArrows));

  var gFront = el('g', {});
  var fGuideX = el('line', { stroke: GREY, 'stroke-width': 1, 'stroke-dasharray': '3 3' }, gFront);
  var fGuideY = el('line', { stroke: GREY, 'stroke-width': 1, 'stroke-dasharray': '3 3' }, gFront);
  var fArrX = el('line', { stroke: GREY, 'stroke-width': 3.2 }, gFront), fHeadX = el('path', { fill: GREY }, gFront);
  var fArrY = el('line', { stroke: ORANGE, 'stroke-width': 3.2, 'stroke-dasharray': '8 5' }, gFront), fHeadY = el('path', { fill: ORANGE }, gFront);
  var fTextX = text(0, 0, '수평 편파 E_{x}', { 'text-anchor': 'middle' }, gFront);
  var fTextY = text(0, 0, '수직 편파 E_{y}', { 'text-anchor': 'end' }, gFront);
  var mark = el('line', { stroke: ORANGE, 'stroke-width': 4.5, 'stroke-linecap': 'round' });
  var markHead = el('path', { fill: ORANGE, stroke: INK, 'stroke-width': 0.8 });

  var ROW = 'display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:16px;line-height:1.3;color:' + INK + ';font-family:' + SANS;
  var BTN = 'font:inherit;padding:5px 14px;border:1.5px solid ' + INK + ';background:#fff;color:' + INK + ';border-radius:4px;cursor:pointer';
  var ON = 'font:inherit;padding:4px 13px;border:2.5px solid ' + ORANGE + ';background:#fdebc8;color:' + INK + ';border-radius:4px;cursor:pointer;font-weight:bold';

  function sym(c) { return '<span style="font-family:&quot;Times New Roman&quot;,serif;font-size:112%;font-style:italic">' + c + '</span>'; }
  function sub(c) { return '<span style="font-family:&quot;Times New Roman&quot;,serif;font-style:italic;font-size:80%;vertical-align:sub;line-height:0">' + c + '</span>'; }
  function sup(c) { return '<span style="font-family:&quot;Times New Roman&quot;,serif;font-size:80%;vertical-align:super;line-height:0">' + c + '</span>'; }
  var EX = sym('E') + sub('x'), EY = sym('E') + sub('y');
  function mk(tag, css, parent) { var e = document.createElement(tag); e.style.cssText = css || ''; parent.appendChild(e); return e; }
  var row1 = mk('div', ROW, box), row2 = mk('div', ROW, box);
  var btn = mk('button', BTN + ';min-width:84px', row1); btn.type = 'button';
  var bLag = mk('button', BTN, row1); bLag.type = 'button'; bLag.innerHTML = EY + ' 의 위상이 ' + EX + ' 보다 90° 늦음';
  var bLead = mk('button', BTN, row1); bLead.type = 'button'; bLead.innerHTML = EY + ' 의 위상이 ' + EX + ' 보다 90° 앞섬';
  var lab = mk('label', 'display:inline-flex;align-items:center;gap:6px;cursor:pointer', row1);
  var comp = mk('input', 'width:18px;height:18px;margin:0;accent-color:' + BLUE, lab); comp.type = 'checkbox'; comp.checked = true;
  lab.appendChild(document.createTextNode('두 성분 보이기'));
  mk('span', '', row2).textContent = '보는 방향:';
  var names = ['oblique', 'front', 'side', 'top'], vLabel = { oblique: '비스듬히', front: '앞에서', side: '옆에서', top: '밑에서' }, vBtn = {};
  names.forEach(function (n) { vBtn[n] = mk('button', BTN, row2); vBtn[n].type = 'button'; vBtn[n].textContent = vLabel[n]; });
  var LINE = 'line-height:1.3;color:' + INK + ';font-family:' + SANS;
  var cap = mk('div', 'margin-top:6px;font-size:18px;font-weight:bold;' + LINE, box);
  var turn = mk('div', 'margin-top:2px;font-size:16px;' + LINE, box);
  var euler = mk('div', 'margin-top:2px;font-size:16px;' + LINE, box);

  var q = new URLSearchParams(location.search);
  var CAP = {
    oblique: '비스듬히 보면: 한 순간에 파란 화살표의 끝을 이으면 나사선',
    front: '앞에서 보면: 수평 편파(' + EX + ')와 수직 편파(' + EY + ')를 더한 전기장의 끝이 원을 그림',
    side: '옆에서 보면 (+' + sym('y') + ' 쪽에서 봄): ' + EX + ' 성분의 곡선만 보임',
    top: '밑에서 보면 (−' + sym('x') + ' 쪽에서 봄): ' + EY + ' 성분의 곡선만 보임'
  };
  var printView = q.get('view') === 'print' || q.has('print-pdf');
  var view = names.indexOf(q.get('view')) >= 0 ? q.get('view') : 'oblique';
  var fromF = VIEWS[view], toF = fromF, turning = 1, TURN_SEC = 1.3;
  cur = fromF;
  var phi = -Math.PI / 2;
  var SPEED = 1 / 5;
  var frozen = q.has('t') && isFinite(parseFloat(q.get('t')));
  var t = frozen ? parseFloat(q.get('t')) : 0.10, playing = !frozen && !printView, last = null;

  function setView(name) { if (name === view && turning >= 1) return; fromF = cur; toF = VIEWS[name]; turning = 0; view = name; }

  function setPhi(v) {
    phi = v;
    var lag = phi < 0;
    bLag.style.cssText = lag ? ON : BTN; bLead.style.cssText = lag ? BTN : ON;
    turn.textContent = lag
      ? '다가오는 파를 마주 보면 전기장이 반시계 방향으로 돎 (오른쪽 원형 편파)'
      : '다가오는 파를 마주 보면 전기장이 시계 방향으로 돎 (왼쪽 원형 편파)';

    euler.innerHTML = sym('x') + ' 축을 실수축, ' + sym('y') + ' 축을 허수축으로 보면 ' + EX + ' + ' + sym('j') + EY + ' = ' + sym('E') + sub('0') + ' ' + sym('e') +
      sup((lag ? '+' : '−') + '<span style="font-style:italic">j</span>(<span style="font-style:italic">ωt</span> − <span style="font-style:italic">k</span><span style="font-size:75%;vertical-align:sub;line-height:0">0</span><span style="font-style:italic">z</span>)') +
      ' : 오일러 식이 그리는 원과 같은 원';
    fill(eyText, 'E_{y} = E_{0} cos(ωt − k_{0}z ' + (lag ? '− 90°)' : '+ 90°)'));
  }

  function draw() {
    var opt = { phi: phi }, i, z, f, a, b, k;

    var zLen = Math.hypot(P(0, 0, 2)[0] - P(0, 0, 0)[0], P(0, 0, 2)[1] - P(0, 0, 0)[1]);
    var along = Math.max(0, Math.min(1, (zLen - 60) / 200));

    function axis(key, p0, p1, tip, shift) {
      a = P(p0[0], p0[1], p0[2]); b = P(p1[0], p1[1], p1[2]);
      var len = Math.hypot(b[0] - a[0], b[1] - a[1]), on = len > 34 ? 1 : 0, ux = (b[0] - a[0]) / (len || 1), uy = (b[1] - a[1]) / (len || 1);
      setLine(axes[key].line, a, b);
      axes[key].head.setAttribute('d', on ? head(P(tip[0], tip[1], tip[2]), b, 11) : '');
      axes[key].line.setAttribute('opacity', on); axes[key].text.setAttribute('opacity', on);
      axes[key].text.setAttribute('x', (b[0] + ux * 12 + shift[0]).toFixed(1)); axes[key].text.setAttribute('y', (b[1] + uy * 12 + shift[1]).toFixed(1));
      axes[key].text.setAttribute('text-anchor', ux < -0.3 ? 'end' : (ux > 0.3 ? 'start' : 'middle'));
      return b;
    }
    var zEnd = axis('z', [0, 0, -0.06], [0, 0, 2.46], [0, 0, 2.2], [0, 6]);
    axis('x', [-1.3, 0, 0], [1.5, 0, 0], [0, 0, 0], [0, 0]);
    axis('y', [0, -1.3, 0], [0, 1.6, 0], [0, 0, 0], [0, 6]);
    a = P(0, 0, 2.08);
    goText.setAttribute('x', a[0].toFixed(1)); goText.setAttribute('y', (zEnd[1] - 12).toFixed(1)); goText.setAttribute('opacity', along);

    plane.setAttribute('d', pathOf([P(1.3, 1.3, Z0), P(1.3, -1.3, Z0), P(-1.3, -1.3, Z0), P(-1.3, 1.3, Z0)]) + 'Z');
    var rp = [];
    for (k = 0; k <= 72; k++) rp.push(P(Math.cos(k * Math.PI / 36), Math.sin(k * Math.PI / 36), Z0));
    ring.setAttribute('d', pathOf(rp));
    var corner = [P(-1.3, 1.3, Z0), P(-1.3, -1.3, Z0), P(1.3, 1.3, Z0), P(1.3, -1.3, Z0)].sort(function (m, n) { return n[1] - m[1] || m[0] - n[0]; })[0];
    planeText.setAttribute('x', (Math.min(corner[0], 520)).toFixed(1)); planeText.setAttribute('y', (corner[1] + 20).toFixed(1));
    var e1 = P(1.3, 1.3, Z0), e2 = P(1.3, -1.3, Z0), e3 = P(-1.3, -1.3, Z0);
    var area = Math.abs((e2[0] - e1[0]) * (e3[1] - e2[1]) - (e2[1] - e1[1]) * (e3[0] - e2[0]));
    planeText.setAttribute('opacity', area > 4000 ? 1 : 0);
    var s = phi < 0 ? 1 : -1, pts = [];
    for (k = 0; k <= 20; k++) { var ang = s * (10 + 50 * k / 20) * Math.PI / 180; pts.push(P(1.2 * Math.cos(ang), 1.2 * Math.sin(ang), Z0)); }
    turnArc.setAttribute('d', pathOf(pts)); turnHead.setAttribute('d', head(pts[12], pts[20], 12));

    var hx = [], cx = [], cy = [], hd = '';
    for (i = 0; i <= 240; i++) {
      z = 2 * i / 240; f = physics(z, t, opt);
      hx.push(P(f.Ex, f.Ey, z)); cx.push(P(f.Ex, 0, z)); cy.push(P(0, f.Ey, z));
    }
    helix.setAttribute('d', pathOf(hx)); compX.setAttribute('d', pathOf(cx)); compY.setAttribute('d', pathOf(cy));
    for (i = 0; i <= N; i++) {
      z = 2 * i / N; f = physics(z, t, opt);
      var base = P(0, 0, z), tip = P(f.Ex, f.Ey, z);
      setLine(arrows[i], base, tip); hd += head(base, tip, 8);
    }
    heads.setAttribute('d', hd);
    gArrows.setAttribute('opacity', along.toFixed(2));
    f = physics(Z0, t, opt);
    var b0 = P(0, 0, Z0), t0 = P(f.Ex, f.Ey, Z0);
    setLine(mark, b0, t0); markHead.setAttribute('d', head(b0, t0, 14));

    var tx = P(f.Ex, 0, Z0), ty = P(0, f.Ey, Z0);
    setLine(fArrX, b0, tx); fHeadX.setAttribute('d', head(b0, tx, 13));
    setLine(fArrY, b0, ty); fHeadY.setAttribute('d', head(b0, ty, 13));
    setLine(fGuideX, tx, t0); setLine(fGuideY, ty, t0);
    a = P(0.62, 0, Z0); fTextX.setAttribute('x', a[0].toFixed(1)); fTextX.setAttribute('y', (a[1] + 30).toFixed(1));
    a = P(0, 0.62, Z0); fTextY.setAttribute('x', (a[0] - 14).toFixed(1)); fTextY.setAttribute('y', (a[1] + 6).toFixed(1));
    gFront.setAttribute('opacity', (1 - along).toFixed(2));
  }

  function show() {
    draw();
    btn.textContent = playing ? '멈춤' : '재생';
    gComp.setAttribute('display', comp.checked ? 'inline' : 'none');
    gFront.setAttribute('display', comp.checked ? 'inline' : 'none');
    names.forEach(function (n) { vBtn[n].style.cssText = (n === view ? ON : BTN); });
    cap.innerHTML = CAP[view];
  }
  btn.addEventListener('click', function () { playing = !playing; show(); btn.blur(); });
  bLag.addEventListener('click', function () { setPhi(-Math.PI / 2); show(); bLag.blur(); });
  bLead.addEventListener('click', function () { setPhi(Math.PI / 2); show(); bLead.blur(); });
  names.forEach(function (n) { vBtn[n].addEventListener('click', function () { setView(n); show(); vBtn[n].blur(); }); });
  comp.addEventListener('change', function () { show(); comp.blur(); });

  function tick(now) {
    var dt = last === null ? 0 : (now - last) / 1000;
    last = now;
    if (playing) t = step(t, dt, SPEED);
    if (turning < 1) { turning = turnStep(turning, dt, TURN_SEC); cur = mix(fromF, toF, ease(turning)); }
    show();
    requestAnimationFrame(tick);
  }
  svg.__state = function () { return { t: t, playing: playing, phi: phi, view: view, turning: turning < 1 }; };
  setPhi(q.get('phi') === 'lead' ? Math.PI / 2 : -Math.PI / 2);
  show();
  requestAnimationFrame(tick);
})();
</script>
