<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>움직여 보기: L형 정합 · 초고주파공학 2</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.1rem 0.9rem 2rem;
    background: #ffffff; color: #333333;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo",
                 "Noto Sans KR", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header { max-width: 720px; margin: 0 auto 0.9rem; }
  h1 { font-size: 1.12rem; line-height: 1.4; margin: 0 0 0.15rem; color: #0b3050; }
  .과목 { font-size: 0.8rem; color: #8a8a8a; }
  main { max-width: 720px; margin: 0 auto; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  /* 🔴 가로로 긴 위젯은 폰 폭(375px)에 넣으면 6배 축소돼 글자가 안 읽힌다
     (실측 2026-09-05, 모바일 에뮬레이션). ⇒ 최소 폭을 두고 좌우로 밀게 한다.
     위젯의 클릭 좌표는 getBoundingClientRect() 로 계산하므로 스크롤과 무관하다. */
  .캔버스틀 { overflow-x: auto; -webkit-overflow-scrolling: touch;
              margin: 0 -0.9rem; padding: 0 0.9rem; }
  .안내 { max-width: 720px; margin: 0 auto 0.7rem; font-size: 0.78rem;
          color: #8a6d3b; background: #fdf7e7; border-left: 3px solid #E69F00;
          padding: 0.45rem 0.7rem; border-radius: 3px; }
  @media (min-width: 760px) { .안내 { display: none; } }
  footer {
    max-width: 720px; margin: 2rem auto 0; padding-top: 0.8rem;
    border-top: 1px solid #e5e5e5;
    font-size: 0.72rem; color: #9a9a9a; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
<header>
<h1>움직여 보기: L형 정합</h1>
<div class="과목">초고주파공학 2</div>
</header>

<main>
<div style="text-align:center">
<div id="lsbox" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;max-width:1120px;margin:0 auto">
<canvas id="lsecsim" width="920" height="920"
        style="flex:0 1 430px;max-width:430px;width:100%;cursor:crosshair;touch-action:none"></canvas>
<div style="flex:1 1 300px;text-align:left;line-height:1.5;font-size:max(0.84em, 20px)">
<div><math><msub><mi>z</mi><mi>L</mi></msub><mo>=</mo><mn id="ls-zl">1.60 − j1.20</mn></math> <span style="font-size:0.7em;color:#666">(차트를 누르면 바뀜)</span></div>
<div id="ls-order" style="font-size:0.78em;color:#666">1 + jx 원 안 → (a) 병렬 먼저</div>
<div><math><mi>b</mi><mo>=</mo><mn id="ls-b">0.19</mn></math> <span id="ls-belem" style="font-size:0.75em;color:#666">병렬 C 0.25 pF</span></div>
<div><math><msub><mi>x</mi><mi>s</mi></msub><mo>=</mo><mn id="ls-x">1.22</mn></math> <span id="ls-xelem" style="font-size:0.75em;color:#666">직렬 L 4.05 nH</span></div>
<div><math><msub><mi>z</mi><mrow><mi>i</mi><mi>n</mi></mrow></msub><mo>=</mo><mn id="ls-zin">1.00 + j0.00</mn></math></div>
<div><math><mo>|</mo><msub><mi mathvariant="normal">&#x393;</mi><mrow><mi>i</mi><mi>n</mi></mrow></msub><mo>|</mo><mo>=</mo><mn id="ls-g">0.00</mn></math></div>
<div id="ls-hint" style="font-size:0.66em;color:#666;margin-top:0.4em">정합. 부호가 소자를 정합니다 (b &gt; 0 은 C, x<sub>s</sub> &gt; 0 은 L, 2.4 GHz)</div>
<svg id="ls-circ" viewBox="0 0 340 142" style="width:100%;max-width:340px;display:block;margin-top:0.3em"></svg>
</div>
</div>
<div style="max-width:960px;margin:0.3em auto 0;font-size:0.7em;display:flex;flex-wrap:wrap;align-items:center;gap:10px">
<span style="white-space:nowrap">병렬 <i>b</i></span>
<input id="lsb" type="range" min="-8" max="8" step="0.01" value="0.19" style="flex:1 1 130px">
<span id="lsbv" style="width:3em;text-align:left">0.19</span>
<span style="white-space:nowrap;margin-left:6px">직렬 <i>x</i><sub>s</sub></span>
<input id="lsx" type="range" min="-8" max="8" step="0.01" value="1.22" style="flex:1 1 130px">
<span id="lsxv" style="width:3em;text-align:left">1.22</span>
<button id="ls-s1" type="button" style="font-size:0.95em;padding:2px 10px">해 1</button>
<button id="ls-s2" type="button" style="font-size:0.95em;padding:2px 10px">해 2</button>
</div>
</div>

<script>
(function () {
  var cv = document.getElementById("lsecsim");
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext("2d");
  var sb = document.getElementById("lsb"), sbv = document.getElementById("lsbv");
  var sx = document.getElementById("lsx"), sxv = document.getElementById("lsxv");
  var BLUE = "#0072B2", ORANGE = "#E69F00", SKY = "#56B4E9", LIGHT = "#d0d0d0";
  var SERIF = '"Times New Roman", "Nimbus Roman", serif';
  var W = 460, H = 460, CX = 230, CY = 232, R = 200;
  var Z0 = 50, F0 = 2.4e9;
  var rL = 1.60, xL = -1.20, b = 0.19, xs = 1.22;
  function gam(r, x) { var a = r - 1, c = r + 1, den = c * c + x * x; return [(a * c + x * x) / den, (x * c - a * x) / den]; }
  function zof(gr, gi) { var a = 1 + gr, c = 1 - gr, d = -gi, den = c * c + d * d; return [(a * c + gi * d) / den, (gi * c - a * d) / den]; }
  function inv(r, x) { var d = r * r + x * x; return [r / d, -x / d]; }
  function X(gr) { return CX + gr * R; }
  function Y(gi) { return CY - gi * R; }
  function fmt(v, n) { if (Math.abs(v) < 0.5 * Math.pow(10, -n)) v = 0; return v.toFixed(n).replace("-", "−"); }
  function cplx(r, x, n) { if (Math.abs(x) < 0.5 * Math.pow(10, -n)) x = 0; return fmt(r, n) + (x < 0 ? " − j" : " + j") + Math.abs(x).toFixed(n); }
  function circlePath(r) { ctx.beginPath(); ctx.arc(X(r / (1 + r)), CY, R / (1 + r), 0, 6.2832); ctx.stroke(); }
  function xArc(x) { ctx.save(); ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.2832); ctx.clip(); ctx.beginPath(); ctx.arc(X(1), Y(1 / x), R / Math.abs(x), 0, 6.2832); ctx.stroke(); ctx.restore(); }
  function drawChart() {
    var i, rv = [0.2, 0.5, 1, 2, 5], xv = [0.2, 0.5, 1, 2, 5];
    ctx.strokeStyle = LIGHT; ctx.lineWidth = 1;
    for (i = 0; i < rv.length; i++) circlePath(rv[i]);
    for (i = 0; i < xv.length; i++) { xArc(xv[i]); xArc(-xv[i]); }
    ctx.beginPath(); ctx.moveTo(X(-1), CY); ctx.lineTo(X(1), CY); ctx.stroke();
    ctx.strokeStyle = BLUE; ctx.lineWidth = 2.2; circlePath(1);
    ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(X(-0.5), CY, R * 0.5, 0, 6.2832); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = "#000"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = "#666"; ctx.font = "13px " + SERIF; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    for (i = 0; i < rv.length; i++) { var g = gam(rv[i], 0); ctx.fillText(String(rv[i]), X(g[0]), CY - 2); }
    ctx.textBaseline = "middle";
    for (i = 0; i < xv.length; i++) { var gp = gam(0, xv[i]), gm = gam(0, -xv[i]); ctx.fillText("+j" + xv[i], X(gp[0] * 1.09), Y(gp[1] * 1.09)); ctx.fillText("−j" + xv[i], X(gm[0] * 1.09), Y(gm[1] * 1.09)); }
    ctx.fillStyle = BLUE; ctx.font = "italic 13px " + SERIF; ctx.fillText("r = 1", X(0.55), Y(0.62)); ctx.fillText("g = 1", X(-0.55), Y(0.62));
  }
  function path(pts, color, dash) {
    ctx.strokeStyle = color; ctx.lineWidth = 3; if (dash) ctx.setLineDash([4, 4]);
    ctx.beginPath(); for (var i = 0; i < pts.length; i++) { var g = gam(pts[i][0], pts[i][1]); if (i === 0) ctx.moveTo(X(g[0]), Y(g[1])); else ctx.lineTo(X(g[0]), Y(g[1])); }
    ctx.stroke(); ctx.setLineDash([]);
  }
  function dot(z, color, shape) {
    var g = gam(z[0], z[1]); ctx.fillStyle = color; ctx.strokeStyle = "#000"; ctx.lineWidth = 1;
    if (shape === "o") { ctx.beginPath(); ctx.arc(X(g[0]), Y(g[1]), 6.5, 0, 6.2832); ctx.fill(); ctx.stroke(); }
    else if (shape === "s") { ctx.fillRect(X(g[0]) - 6, Y(g[1]) - 6, 12, 12); ctx.strokeRect(X(g[0]) - 6, Y(g[1]) - 6, 12, 12); }
    else { ctx.beginPath(); for (var k = 0; k < 10; k++) { var a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 4 : 9; ctx.lineTo(X(g[0]) + rr * Math.cos(a), Y(g[1]) + rr * Math.sin(a)); } ctx.closePath(); ctx.fill(); ctx.stroke(); }
  }
  function setText(id, s) { var el = document.getElementById(id); if (el) el.textContent = s; }
  function elemText(kind, v) {
    var w = 2 * Math.PI * F0;
    if (v === 0) return kind === "b" ? "병렬 소자 없음" : "직렬 소자 없음";
    if (kind === "b") return v > 0 ? "병렬 C " + (v / (w * Z0) * 1e12).toFixed(2) + " pF" : "병렬 L " + (-Z0 / (w * v) * 1e9).toFixed(2) + " nH";
    return v > 0 ? "직렬 L " + (v * Z0 / w * 1e9).toFixed(2) + " nH" : "직렬 C " + (-1 / (w * v * Z0) * 1e12).toFixed(2) + " pF";
  }
  function solutions() {
    var r = rL, x = xL, out = [], s;
    if (r > 1) { var rt = Math.sqrt(r) * Math.sqrt(Math.max(0, r * r + x * x - r)); for (s = 1; s >= -1; s -= 2) { var bb = (x + s * rt) / (r * r + x * x); out.push([bb, 1 / bb + x / r - 1 / (bb * r)]); } }
    else if (r < 1) { for (s = 1; s >= -1; s -= 2) out.push([s * Math.sqrt((1 - r) / r), s * Math.sqrt(r * (1 - r)) - x]); }
    else out.push([0, -x], [0, -x]);
    return out;
  }
  function draw() {
    ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.clearRect(0, 0, W, H); ctx.lineJoin = "round";
    drawChart();
    var inside = rL > 1, y = inv(rL, xL), z1, zin, k, N = 60, p1 = [], p2 = [];
    if (inside) {
      for (k = 0; k <= N; k++) p1.push(inv(y[0], y[1] + b * k / N));
      z1 = inv(y[0], y[1] + b);
      for (k = 0; k <= N; k++) p2.push([z1[0], z1[1] + xs * k / N]);
      zin = [z1[0], z1[1] + xs];
    } else {
      for (k = 0; k <= N; k++) p1.push([rL, xL + xs * k / N]);
      z1 = [rL, xL + xs]; var y1 = inv(z1[0], z1[1]);
      for (k = 0; k <= N; k++) p2.push(inv(y1[0], y1[1] + b * k / N));
      zin = inv(y1[0], y1[1] + b);
    }
    path(p1, SKY, false); path(p2, ORANGE, true);
    dot([rL, xL], "#000", "o"); dot(z1, SKY, "s"); dot(zin, ORANGE, "*");
    var g = gam(zin[0], zin[1]), mag = Math.sqrt(g[0] * g[0] + g[1] * g[1]);
    setText("ls-zl", cplx(rL, xL, 2)); setText("ls-b", fmt(b, 2)); setText("ls-x", fmt(xs, 2));
    setText("ls-order", inside ? "1 + jx 원 안 → (a) 부하에 병렬 먼저" : (rL < 1 ? "1 + jx 원 밖 → (b) 부하에 직렬 먼저" : "1 + jx 원 위 → 직렬만으로"));
    setText("ls-belem", elemText("b", b)); setText("ls-xelem", elemText("x", xs));
    setText("ls-zin", cplx(zin[0], zin[1], 2)); setText("ls-g", fmt(mag, 2));
    var gel = document.getElementById("ls-g"); if (gel) gel.style.color = mag < 0.03 ? ORANGE : "";
    var hint;
    if (mag < 0.03) hint = "정합. 부호가 소자를 정합니다 (b > 0 은 C, xs > 0 은 L, 2.4 GHz)";
    else if (inside) hint = Math.abs(z1[0] - 1) > 0.04 ? "병렬 b 로 먼저 1 + jx 원에 올리세요 (지금 r = " + fmt(z1[0], 2) + ")" : "1 + jx 원 위. 이제 직렬 xs 로 허수부 " + fmt(z1[1], 2) + " 를 지우세요";
    else { var y1b = inv(z1[0], z1[1]); hint = Math.abs(y1b[0] - 1) > 0.04 ? "직렬 xs 로 먼저 g = 1 원에 올리세요 (지금 g = " + fmt(y1b[0], 2) + ")" : "g = 1 원 위. 이제 병렬 b 로 허수부 " + fmt(y1b[1], 2) + " 를 지우세요"; }
    setText("ls-hint", hint);
    drawCircuit(inside, b, xs);
  }

  var circ = document.getElementById("ls-circ");
  function svgSeries(kind, x0, x1, y) {
    var xm = (x0 + x1) / 2, s = "";
    if (kind === "C") s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + (xm - 5) + '" y2="' + y + '" stroke="#222" stroke-width="1.6"/><line x1="' + (xm - 5) + '" y1="' + (y - 11) + '" x2="' + (xm - 5) + '" y2="' + (y + 11) + '" stroke="#E69F00" stroke-width="2.4"/><line x1="' + (xm + 5) + '" y1="' + (y - 11) + '" x2="' + (xm + 5) + '" y2="' + (y + 11) + '" stroke="#E69F00" stroke-width="2.4"/><line x1="' + (xm + 5) + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '" stroke="#222" stroke-width="1.6"/>';
    else if (kind === "L") { s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + (xm - 21) + '" y2="' + y + '" stroke="#222" stroke-width="1.6"/><path d="M' + (xm - 21) + ' ' + y + ' a7 7 0 0 1 14 0 a7 7 0 0 1 14 0 a7 7 0 0 1 14 0" fill="none" stroke="#E69F00" stroke-width="2.4"/><line x1="' + (xm + 21) + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '" stroke="#222" stroke-width="1.6"/>'; }
    else s += '<line x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '" stroke="#222" stroke-width="1.6"/>';
    return s;
  }
  function svgShunt(kind, x, y0, y1) {
    var ym = (y0 + y1) / 2, s = "";
    if (kind === "C") s += '<line x1="' + x + '" y1="' + y0 + '" x2="' + x + '" y2="' + (ym - 5) + '" stroke="#222" stroke-width="1.6"/><line x1="' + (x - 11) + '" y1="' + (ym - 5) + '" x2="' + (x + 11) + '" y2="' + (ym - 5) + '" stroke="#E69F00" stroke-width="2.4"/><line x1="' + (x - 11) + '" y1="' + (ym + 5) + '" x2="' + (x + 11) + '" y2="' + (ym + 5) + '" stroke="#E69F00" stroke-width="2.4"/><line x1="' + x + '" y1="' + (ym + 5) + '" x2="' + x + '" y2="' + y1 + '" stroke="#222" stroke-width="1.6"/>';
    else if (kind === "L") s += '<line x1="' + x + '" y1="' + y0 + '" x2="' + x + '" y2="' + (ym - 21) + '" stroke="#222" stroke-width="1.6"/><path d="M' + x + ' ' + (ym - 21) + ' a7 7 0 0 1 0 14 a7 7 0 0 1 0 14 a7 7 0 0 1 0 14" fill="none" stroke="#E69F00" stroke-width="2.4"/><line x1="' + x + '" y1="' + (ym + 21) + '" x2="' + x + '" y2="' + y1 + '" stroke="#222" stroke-width="1.6"/>';
    return s;
  }
  function drawCircuit(inside, b, xs) {
    if (!circ) return;
    var kb = b > 0 ? "C" : (b < 0 ? "L" : "-"), kx = xs > 0 ? "L" : (xs < 0 ? "C" : "-");
    var yT = 34, yB = 96, s = "";
    var xS0, xS1, xP;
    if (inside) { xS0 = 90; xS1 = 170; xP = 236; }
    else { xS0 = 186; xS1 = 266; xP = 120; }
    s += '<line x1="12" y1="' + yT + '" x2="' + xS0 + '" y2="' + yT + '" stroke="#222" stroke-width="1.6"/>';
    s += svgSeries(kx, xS0, xS1, yT);
    s += '<line x1="' + xS1 + '" y1="' + yT + '" x2="284" y2="' + yT + '" stroke="#222" stroke-width="1.6"/>';
    s += '<line x1="12" y1="' + yB + '" x2="284" y2="' + yB + '" stroke="#222" stroke-width="1.6"/>';
    s += svgShunt(kb, xP, yT, yB);

    s += '<circle cx="284" cy="' + yT + '" r="3.2" fill="#fff" stroke="#222" stroke-width="1.4"/><circle cx="284" cy="' + yB + '" r="3.2" fill="#fff" stroke="#222" stroke-width="1.4"/>';
    s += '<line x1="287" y1="' + yT + '" x2="308" y2="' + yT + '" stroke="#222" stroke-width="1.6"/><line x1="308" y1="' + yT + '" x2="308" y2="52" stroke="#222" stroke-width="1.6"/><line x1="287" y1="' + yB + '" x2="308" y2="' + yB + '" stroke="#222" stroke-width="1.6"/><line x1="308" y1="' + yB + '" x2="308" y2="78" stroke="#222" stroke-width="1.6"/>';
    s += '<rect x="298" y="52" width="20" height="26" fill="#fff" stroke="#222" stroke-width="1.6"/><text x="326" y="70" font-size="13" font-style="italic" font-family="Times New Roman, serif">Z</text><text x="334" y="74" font-size="9" font-style="italic" font-family="Times New Roman, serif">L</text>';
    s += '<text x="14" y="' + (yT + yB) / 2 + '" font-size="12" font-style="italic" font-family="Times New Roman, serif" fill="#555">Z</text><text x="22" y="' + ((yT + yB) / 2 + 4) + '" font-size="9" font-family="Times New Roman, serif" fill="#555">0</text>';

    var txS = kx === "-" ? "직렬 없음" : (kx === "L" ? "L " + (xs * Z0 / (2 * Math.PI * F0) * 1e9).toFixed(2) + " nH" : "C " + (-1 / (2 * Math.PI * F0 * xs * Z0) * 1e12).toFixed(2) + " pF");
    var txP = kb === "-" ? "병렬 없음" : (kb === "C" ? "C " + (b / (2 * Math.PI * F0 * Z0) * 1e12).toFixed(2) + " pF" : "L " + (-Z0 / (2 * Math.PI * F0 * b) * 1e9).toFixed(2) + " nH");
    s += '<text x="' + ((xS0 + xS1) / 2) + '" y="' + (yT - 16) + '" font-size="11" text-anchor="middle" font-family="Malgun Gothic, sans-serif" fill="#8a5a00">' + txS + '</text>';
    s += '<text x="' + xP + '" y="' + (yB + 16) + '" font-size="11" text-anchor="middle" font-family="Malgun Gothic, sans-serif" fill="#8a5a00">' + txP + '</text>';
    s += '<text x="12" y="' + (yB + 38) + '" font-size="10.5" font-family="Malgun Gothic, sans-serif" fill="#666">회로: ' + (inside ? "(a) 부하에 병렬 먼저" : "(b) 부하에 직렬 먼저") + '</text>';
    circ.innerHTML = s;
  }
  function setSliders(bb, xx) { b = Math.round(bb * 100) / 100; xs = Math.round(xx * 100) / 100; sb.value = b; sx.value = xs; sbv.textContent = fmt(b, 2); sxv.textContent = fmt(xs, 2); draw(); }
  function pick(ev) {
    var rc = cv.getBoundingClientRect();
    var mx = (ev.clientX - rc.left) / rc.width * W, my = (ev.clientY - rc.top) / rc.height * H;
    var gr = (mx - CX) / R, gi = (CY - my) / R, m = Math.sqrt(gr * gr + gi * gi);
    if (m > 0.985) { gr *= 0.985 / m; gi *= 0.985 / m; }
    var z = zof(gr, gi);
    rL = Math.max(0.05, Math.round(z[0] * 100) / 100); xL = Math.round(z[1] * 100) / 100;
    draw();
  }
  var down = false;
  cv.addEventListener("pointerdown", function (e) { down = true; pick(e); e.preventDefault(); });
  cv.addEventListener("pointermove", function (e) { if (down) pick(e); });
  window.addEventListener("pointerup", function () { down = false; });
  sb.addEventListener("input", function () { b = Math.round(parseFloat(sb.value) * 100) / 100; sbv.textContent = fmt(b, 2); draw(); });
  sx.addEventListener("input", function () { xs = Math.round(parseFloat(sx.value) * 100) / 100; sxv.textContent = fmt(xs, 2); draw(); });
  sb.addEventListener("keydown", function (e) { e.stopPropagation(); });
  sx.addEventListener("keydown", function (e) { e.stopPropagation(); });
  document.getElementById("ls-s1").addEventListener("click", function () { var s = solutions(); setSliders(s[0][0], s[0][1]); });
  document.getElementById("ls-s2").addEventListener("click", function () { var s = solutions(); setSliders(s[1][0], s[1][1]); });
  draw();
  window.addEventListener("load", draw);
})();
