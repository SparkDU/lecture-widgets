<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>움직여 보기: 선폭을 끌면 Z0 가 바뀐다 · 초고주파공학 2</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.1rem 0.9rem 2rem;
    background: #ffffff; color: #333333;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo",
                 "Noto Sans KR", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header { max-width: 720px; margin: 0 auto 0.9rem; }
  h1 { font-size: 1.12rem; line-height: 1.4; margin: 0 0 0.15rem; color: #0b3050; }
  .과목 { font-size: 0.8rem; color: #8a8a8a; }
  main { max-width: 720px; margin: 0 auto; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  /* 🔴 가로로 긴 위젯은 폰 폭(375px)에 넣으면 6배 축소돼 글자가 안 읽힌다
     (실측 2026-09-05, 모바일 에뮬레이션). ⇒ 최소 폭을 두고 좌우로 밀게 한다.
     위젯의 클릭 좌표는 getBoundingClientRect() 로 계산하므로 스크롤과 무관하다. */
  .캔버스틀 { overflow-x: auto; -webkit-overflow-scrolling: touch;
              margin: 0 -0.9rem; padding: 0 0.9rem; }
  .안내 { max-width: 720px; margin: 0 auto 0.7rem; font-size: 0.78rem;
          color: #8a6d3b; background: #fdf7e7; border-left: 3px solid #E69F00;
          padding: 0.45rem 0.7rem; border-radius: 3px; }
  @media (min-width: 760px) { .안내 { display: none; } }
  footer {
    max-width: 720px; margin: 2rem auto 0; padding-top: 0.8rem;
    border-top: 1px solid #e5e5e5;
    font-size: 0.72rem; color: #9a9a9a; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
<header>
<h1>움직여 보기: 선폭을 끌면 Z0 가 바뀐다</h1>
<div class="과목">초고주파공학 2</div>
</header>
<p class="안내">폰이라면 <b>가로로 돌리거나</b> 그림을 <b>좌우로 밀어</b> 보세요. 손가락으로 벌리면 확대됩니다.</p>
<main>
<div style="text-align:center">
<div class="캔버스틀"><canvas id="mstripsim" width="1920" height="800"
        style="min-width:680px;width:100%;max-width:820px;touch-action:none"></canvas></div>
<div style="max-width:820px;margin:0 auto;font-size:0.72em;display:flex;align-items:center;gap:12px">
<span style="white-space:nowrap">띠 폭 <i>W</i> (mm)</span>
<input id="mstripw" type="range" min="0.3" max="10" step="0.05" value="3.05" style="flex:1">
<span id="mstripwv" style="width:3.4em;text-align:left">3.05</span>
<span style="color:#666">· FR-4 1.6 mm · 2.4 GHz</span>
</div>
</div>

<script>
(function () {
  var cv = document.getElementById("mstripsim");
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext("2d");
  var slider = document.getElementById("mstripw"), wv = document.getElementById("mstripwv");
  var ORANGE = "#E69F00", BLUE = "#0072B2", INK = "#222222", COND = "#555555", DIEL = "#DCEBF7";
  var SERIF = '"Times New Roman", "Nimbus Roman", serif', SANS = '"Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
  var W = 960, H = 400;
  var ER = 4.4, D = 1.6, F = 2.4e9, C0 = 299792458;
  var wmm = 3.05;

  function ee(wd) { return (ER + 1) / 2 + (ER - 1) / 2 / Math.sqrt(1 + 12 / wd); }
  function z0(wd) {
    var e = ee(wd);
    if (wd <= 1) return 60 / Math.sqrt(e) * Math.log(8 / wd + wd / 4);
    return 120 * Math.PI / (Math.sqrt(e) * (wd + 1.393 + 0.667 * Math.log(wd + 1.444)));
  }
  function label(txt, x, y, color, font, align) {
    ctx.fillStyle = color; ctx.font = font; ctx.textAlign = align || "left"; ctx.textBaseline = "middle"; ctx.fillText(txt, x, y);
  }

  function runs(parts, x, y) {
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i]; ctx.font = p[1]; ctx.fillStyle = p[2] || INK;
      var dy = p[3] || 0; ctx.fillText(p[0], x, y + dy); x += ctx.measureText(p[0]).width;
    }
    return x;
  }
  function draw() {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var wd = wmm / D, e = ee(wd), z = z0(wd);
    var lam0 = C0 / F * 1e3, lam = lam0 / Math.sqrt(e);

    var S = 34, X0 = 40, YG = 300, SUBW = 12 * S;
    ctx.fillStyle = DIEL; ctx.fillRect(X0, YG - D * S, SUBW, D * S);
    ctx.strokeStyle = "#888"; ctx.lineWidth = 0.8; ctx.strokeRect(X0, YG - D * S, SUBW, D * S);
    ctx.fillStyle = COND; ctx.fillRect(X0, YG, SUBW, 8);
    var xs = X0 + SUBW / 2 - wmm * S / 2;
    ctx.fillStyle = COND; ctx.fillRect(xs, YG - D * S - 6, wmm * S, 6);

    var n = Math.max(1, Math.round(wmm * 1.2));
    ctx.strokeStyle = ORANGE; ctx.fillStyle = ORANGE; ctx.lineWidth = 1.4;
    for (var i = 0; i < n; i++) {
      var x = xs + (i + 0.5) / n * wmm * S;
      ctx.beginPath(); ctx.moveTo(x, YG - D * S + 2); ctx.lineTo(x, YG - 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, YG - 2); ctx.lineTo(x - 3.5, YG - 9); ctx.lineTo(x + 3.5, YG - 9); ctx.closePath(); ctx.fill();
    }

    ctx.strokeStyle = INK; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xs, YG - D * S - 22); ctx.lineTo(xs + wmm * S, YG - D * S - 22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(xs, YG - D * S - 27); ctx.lineTo(xs, YG - D * S - 17); ctx.moveTo(xs + wmm * S, YG - D * S - 27); ctx.lineTo(xs + wmm * S, YG - D * S - 17); ctx.stroke();
    runs([["W", "italic 17px " + SERIF], [" = " + wmm.toFixed(2) + " mm", "16px " + SERIF]], X0 + SUBW / 2 - 40, YG - D * S - 40);
    ctx.beginPath(); ctx.moveTo(X0 + SUBW + 14, YG - D * S); ctx.lineTo(X0 + SUBW + 14, YG); ctx.stroke();
    runs([["d", "italic 17px " + SERIF], [" = 1.6 mm", "16px " + SERIF]], X0 + SUBW + 22, YG - D * S / 2);
    label("실척 단면 · 기판 FR-4 (εr = 4.4)", X0, YG + 30, "#666", "14px " + SANS);
    label("주황 화살 = 전계 (띠 → 접지면)", X0, YG + 50, "#666", "14px " + SANS);

    var xr = 560, y0 = 60, dy = 46;
    runs([["W", "italic 22px " + SERIF], [" / ", "22px " + SERIF], ["d", "italic 22px " + SERIF], [" = " + wd.toFixed(2), "22px " + SERIF]], xr, y0);
    runs([["ε", "italic 22px " + SERIF], ["e", "italic 14px " + SERIF, INK, 7], [" = ", "22px " + SERIF],
          ["(ε", "20px " + SERIF], ["r", "italic 13px " + SERIF, INK, 6], ["+1)/2 + (ε", "20px " + SERIF], ["r", "italic 13px " + SERIF, INK, 6],
          ["−1)/2 · 1/√(1+12", "20px " + SERIF], ["d", "italic 20px " + SERIF], ["/", "20px " + SERIF], ["W", "italic 20px " + SERIF], [")", "20px " + SERIF]], xr, y0 + dy);
    runs([["    = " + e.toFixed(2), "22px " + SERIF, BLUE]], xr, y0 + 1.7 * dy);
    runs([["Z", "italic 22px " + SERIF], ["0", "14px " + SERIF, INK, 7], [" = " + z.toFixed(1) + " Ω", "22px " + SERIF, z > 49 && z < 51 ? ORANGE : INK]], xr, y0 + 2.7 * dy);
    runs([["λ", "italic 22px " + SERIF], [" = λ", "22px " + SERIF], ["0", "14px " + SERIF, INK, 7], [" / √ε", "22px " + SERIF], ["e", "italic 14px " + SERIF, INK, 7],
          [" = " + lam0.toFixed(1) + " / " + Math.sqrt(e).toFixed(3) + " = " + lam.toFixed(1) + " mm", "22px " + SERIF]], xr, y0 + 3.7 * dy);
    runs([["λ", "italic 22px " + SERIF], ["/4 = " + (lam / 4).toFixed(1) + " mm", "22px " + SERIF, BLUE]], xr, y0 + 4.7 * dy);
    label(z > 49 && z < 51 ? "50 Ω 근처: 이 폭이 실제 PCB 의 RF 선" : (z > 51 ? "50 Ω 보다 높다 → 띠를 넓히세요" : "50 Ω 보다 낮다 → 띠를 좁히세요"),
          xr, y0 + 5.9 * dy, "#666", "15px " + SANS);
  }
  slider.addEventListener("input", function () { wmm = Math.round(parseFloat(slider.value) * 20) / 20; wv.textContent = wmm.toFixed(2); draw(); });
  slider.addEventListener("keydown", function (e) { e.stopPropagation(); });
  draw();
  window.addEventListener("load", draw);
})();
</script>
</main>
<footer>© 2026 박상욱 · MAE Lab., 순천향대학교 전자공학과<br>All rights reserved · 무단 복제·배포를 금합니다</footer>
</body>
</html>
