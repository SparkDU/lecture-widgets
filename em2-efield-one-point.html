<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>눌러 보기: 한 곳에서 본 전기장 · 전자기학 2</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.1rem 0.9rem 2rem;
    background: #ffffff; color: #333333;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo",
                 "Noto Sans KR", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header { max-width: 720px; margin: 0 auto 0.9rem; }
  h1 { font-size: 1.12rem; line-height: 1.4; margin: 0 0 0.15rem; color: #0b3050; }
  .과목 { font-size: 0.8rem; color: #8a8a8a; }
  main { max-width: 720px; margin: 0 auto; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  /* 🔴 가로로 긴 위젯은 폰 폭(375px)에 넣으면 6배 축소돼 글자가 안 읽힌다
     (실측 2026-09-05, 모바일 에뮬레이션). ⇒ 최소 폭을 두고 좌우로 밀게 한다.
     위젯의 클릭 좌표는 getBoundingClientRect() 로 계산하므로 스크롤과 무관하다. */
  .캔버스틀 { overflow-x: auto; -webkit-overflow-scrolling: touch;
              margin: 0 -0.9rem; padding: 0 0.9rem; }
  .안내 { max-width: 720px; margin: 0 auto 0.7rem; font-size: 0.78rem;
          color: #8a6d3b; background: #fdf7e7; border-left: 3px solid #E69F00;
          padding: 0.45rem 0.7rem; border-radius: 3px; }
  @media (min-width: 760px) { .안내 { display: none; } }
  footer {
    max-width: 720px; margin: 2rem auto 0; padding-top: 0.8rem;
    border-top: 1px solid #e5e5e5;
    font-size: 0.72rem; color: #9a9a9a; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
<header>
<h1>눌러 보기: 한 곳에서 본 전기장</h1>
<div class="과목">전자기학 2</div>
</header>

<main>
<div style="text-align:center">
<div style="overflow-x:auto">
<svg id="한곳전기장" data-widget viewBox="0 0 960 336" role="img" aria-label="한 곳의 전기장 화살표가 위아래로 변하고, 그 끝의 높이가 시간 축에 코사인 곡선으로 그려지는 그림" style="display:block;width:100%;max-width:1000px;min-width:680px;margin:0 auto"></svg>
</div>
<div id="한곳전기장-조작"></div>
</div>

<script>
(function () {
  'use strict';
  var svg = document.getElementById('한곳전기장'), bar = document.getElementById('한곳전기장-조작');
  if (!svg || !bar || !svg.createSVGPoint) return;

  function physics(z, t) {
    return { Ex: Math.cos(2 * Math.PI * (t - z)) };
  }

  function step(t, dt, speed) {
    return t + Math.max(0, Math.min(0.1, dt)) * speed;
  }

  var SPAN = 3;
  function wrap(t) {
    return t - SPAN * Math.floor(t / SPAN);
  }

  var NS = 'http://www.w3.org/2000/svg';
  var BLUE = '#0072B2', ORANGE = '#E69F00', INK = '#1c1c1c', GREY = '#777';
  var SERIF = '"Times New Roman", "Nimbus Roman", serif';
  var SANS = '"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif';

  var BX = 130, Y0 = 172, AMP = 92, X0 = 300, PX = 560 / 3;
  function gx(s) { return X0 + PX * s; }
  function gy(v) { return Y0 - AMP * v; }

  function el(tag, at, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in at) e.setAttribute(k, at[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  function text(x, y, s, at, parent) {
    var t = el('text', Object.assign({ x: x, y: y, 'font-size': 17, fill: INK, 'font-family': SANS }, at || {}), parent);
    var re = /_\{([a-z]*)([0-9]*)\}|(cos|sin)|([A-Za-zωλη]+)|([^A-Za-zωλη_]+|_)/g, m, drop = false;
    function span(str, a) { var ts = el('tspan', a, t); ts.textContent = str; }
    while ((m = re.exec(s))) {
      if (m[1] !== undefined) {
        var first = true;
        if (m[1]) { span(m[1], { 'font-size': '76%', dy: 5, 'font-family': SERIF, 'font-style': 'italic' }); first = false; }
        if (m[2]) span(m[2], first ? { 'font-size': '76%', dy: 5, 'font-family': SERIF } : { 'font-size': '76%', 'font-family': SERIF });
        drop = true; continue;
      }
      var a = drop ? { dy: -5 } : {};
      if (m[4] !== undefined) { a['font-family'] = SERIF; a['font-style'] = 'italic'; a['font-size'] = '112%'; }
      span(m[0], a); drop = false;
    }
    return t;
  }
  function line(a, b, at) { return el('line', Object.assign({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, at)); }
  function setLine(node, a, b) { node.setAttribute('x1', a[0].toFixed(1)); node.setAttribute('y1', a[1].toFixed(1)); node.setAttribute('x2', b[0].toFixed(1)); node.setAttribute('y2', b[1].toFixed(1)); }

  function head(a, b, size) {
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    if (L < size * 1.2) return '';
    var ux = dx / L, uy = dy / L, w = size * 0.42;
    return 'M' + b[0].toFixed(1) + ' ' + b[1].toFixed(1) +
      'L' + (b[0] - ux * size - uy * w).toFixed(1) + ' ' + (b[1] - uy * size + ux * w).toFixed(1) +
      'L' + (b[0] - ux * size + uy * w).toFixed(1) + ' ' + (b[1] - uy * size - ux * w).toFixed(1) + 'Z';
  }

  var axis = { stroke: INK, 'stroke-width': 1.4 }, dots = { stroke: GREY, 'stroke-width': 1, 'stroke-dasharray': '3 4' };
  line([BX, Y0 + 100], [BX, 58], axis); el('path', { d: head([BX, Y0], [BX, 58], 11), fill: INK });
  text(BX + 10, 70, 'x');
  text(BX, 34, '전기장 화살표', { 'text-anchor': 'middle' });
  line([X0, Y0 + 118], [X0, 58], axis); el('path', { d: head([X0, Y0], [X0, 58], 11), fill: INK });
  text(X0 + 10, 70, 'E_{x}');
  line([X0, Y0], [912, Y0], axis); el('path', { d: head([X0, Y0], [912, Y0], 11), fill: INK });
  text(920, Y0 + 6, 't');
  [1, -1].forEach(function (s) {
    line([X0, gy(s)], [868, gy(s)], dots);
    text(876, gy(s) + 6, (s > 0 ? '' : '−') + 'E_{x0}');
  });
  [1, 2, 3].forEach(function (k) {
    line([gx(k), gy(1)], [gx(k), gy(-1) + 6], dots);
    text(gx(k), gy(-1) + 28, (k > 1 ? k : '') + 'T', { 'text-anchor': 'middle' });
  });
  text(BX, gy(-1) + 28, '한 곳 (z = 0)', { 'text-anchor': 'middle' });
  line([330, 322], [374, 322], { stroke: BLUE, 'stroke-width': 3 });
  text(384, 328, '화살표 끝의 높이를 시간 축에 옮겨 그린 선:  E_{x} = E_{x0} cos(ωt)');

  var trace = el('path', { fill: 'none', stroke: BLUE, 'stroke-width': 2.6 });
  var link = el('line', { stroke: ORANGE, 'stroke-width': 1.8, 'stroke-dasharray': '6 5' });
  var shaft = el('line', { stroke: BLUE, 'stroke-width': 5 });
  var tip = el('path', { fill: BLUE });
  el('circle', { cx: BX, cy: Y0, r: 5, fill: INK });
  var pen = el('circle', { r: 6.5, fill: ORANGE, stroke: INK, 'stroke-width': 1 });
  var HS = 17;

  function draw(t) {
    var tt = wrap(t), y = gy(physics(0, tt).Ex), n = Math.max(1, Math.ceil(tt * 80)), d = '', i, s;
    for (i = 0; i <= n; i++) {
      s = tt * i / n;
      d += (i ? 'L' : 'M') + gx(s).toFixed(1) + ' ' + gy(physics(0, s).Ex).toFixed(1);
    }
    trace.setAttribute('d', d);
    var h = head([BX, Y0], [BX, y], HS);
    tip.setAttribute('d', h);
    setLine(shaft, [BX, Y0], [BX, h ? y + (y < Y0 ? 1 : -1) * HS * 0.9 : y]);
    setLine(link, [BX, y], [gx(tt), y]);
    pen.setAttribute('cx', gx(tt).toFixed(1)); pen.setAttribute('cy', y.toFixed(1));
  }

  bar.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:4px;font-size:17px;line-height:1.3;color:' + INK + ';font-family:' + SANS;
  function mk(tag, css) { var e = document.createElement(tag); e.style.cssText = css || ''; bar.appendChild(e); return e; }
  var SYM = '<i style="font-family:&quot;Times New Roman&quot;,serif;font-size:112%;font-style:italic">';
  var btn = mk('button', 'font:inherit;padding:6px 18px;border:1.5px solid ' + INK + ';background:#fff;color:' + INK + ';border-radius:4px;cursor:pointer;min-width:96px');
  btn.type = 'button';
  mk('span').innerHTML = '시간 ' + SYM + 't</i> (' + SYM + 'T</i>: 주기)';
  var slider = mk('input', 'width:320px;accent-color:' + BLUE);
  slider.type = 'range'; slider.min = 0; slider.max = SPAN; slider.step = 0.01;
  slider.setAttribute('aria-label', '시간 t');
  var tval = mk('span', 'min-width:104px;text-align:left;font-variant-numeric:tabular-nums');

  var SPEED = 1 / 4;
  var q = new URLSearchParams(location.search);
  var frozen = q.has('t') && isFinite(parseFloat(q.get('t')));
  var printView = q.get('view') === 'print' || q.has('print-pdf');
  var t = frozen ? parseFloat(q.get('t')) : (printView ? 1.30 : 0), playing = !frozen && !printView, last = null;

  function show() {
    var tt = wrap(t);
    draw(t);
    slider.value = tt; tval.innerHTML = SYM + 't</i> = ' + tt.toFixed(2) + ' ' + SYM + 'T</i>';
    btn.textContent = playing ? '멈춤' : '재생';
  }
  btn.addEventListener('click', function () { playing = !playing; last = null; show(); btn.blur(); });
  slider.addEventListener('input', function () { playing = false; t = parseFloat(slider.value); show(); });
  slider.addEventListener('change', function () { slider.blur(); });

  function tick(now) {
    if (playing) {
      if (last !== null) t = step(t, (now - last) / 1000, SPEED);
      last = now; show();
    } else last = null;
    requestAnimationFrame(tick);
  }
  svg.__state = function () { return { t: t, playing: playing }; };
  show();
  requestAnimationFrame(tick);
})();
</script>
</main>
<footer>© 2026 박상욱 · MAE Lab., 순천향대학교 전자공학과<br>All rights reserved · 무단 복제·배포를 금합니다</footer>
</body>
</html>
