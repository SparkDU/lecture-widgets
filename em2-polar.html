<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>복습 ④ 단위벡터가 자리마다 다르다 · 전자기학 2</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.1rem 0.9rem 2rem;
    background: #ffffff; color: #333333;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo",
                 "Noto Sans KR", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header { max-width: 720px; margin: 0 auto 0.9rem; }
  h1 { font-size: 1.12rem; line-height: 1.4; margin: 0 0 0.15rem; color: #0b3050; }
  .과목 { font-size: 0.8rem; color: #8a8a8a; }
  main { max-width: 720px; margin: 0 auto; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  /* 🔴 가로로 긴 위젯은 폰 폭(375px)에 넣으면 6배 축소돼 글자가 안 읽힌다
     (실측 2026-09-05, 모바일 에뮬레이션). ⇒ 최소 폭을 두고 좌우로 밀게 한다.
     위젯의 클릭 좌표는 getBoundingClientRect() 로 계산하므로 스크롤과 무관하다. */
  .캔버스틀 { overflow-x: auto; -webkit-overflow-scrolling: touch;
              margin: 0 -0.9rem; padding: 0 0.9rem; }
  .안내 { max-width: 720px; margin: 0 auto 0.7rem; font-size: 0.78rem;
          color: #8a6d3b; background: #fdf7e7; border-left: 3px solid #E69F00;
          padding: 0.45rem 0.7rem; border-radius: 3px; }
  @media (min-width: 760px) { .안내 { display: none; } }
  footer {
    max-width: 720px; margin: 2rem auto 0; padding-top: 0.8rem;
    border-top: 1px solid #e5e5e5;
    font-size: 0.72rem; color: #9a9a9a; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
<header>
<h1>복습 ④ 단위벡터가 자리마다 다르다</h1>
<div class="과목">전자기학 2</div>
</header>

<main>
<div style="text-align:center">
<canvas id="극좌표시뮬" width="1040" height="1010"
        style="width:100%;max-width:600px;cursor:crosshair;touch-action:none"></canvas>
<div style="font-size:0.62em;color:#777;margin-top:0.1em">평면 위를 눌러 보세요</div>
</div>

<script>
(function () {
  var cv = document.getElementById("극좌표시뮬");
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext("2d");

  var BLUE = "#0072B2", ORANGE = "#E69F00", GREY = "#9b9b9b", INK = "#333333";

  var SERIF = '"Times New Roman", "Nimbus Roman", serif';
  var SYM = "italic 15px " + SERIF;
  var SYMs = "italic 13px " + SERIF;
  var SUB = "italic 11px " + SERIF;
  var NUM = "15px " + SERIF;
  var W = 520, H = 505;
  var cx = W * 0.50, cy = 215, S = 74;

  var pr = 1.0, pphi = 40 * Math.PI / 180;

  function X(x) { return cx + x * S; }
  function Y(y) { return cy - y * S; }

  function arrow(x0, y0, x1, y1, color, w, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = w; ctx.lineCap = "round";
    var a = Math.atan2(y1 - y0, x1 - x0), h = 4 + w * 1.6;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1 - h * 0.85 * Math.cos(a), y1 - h * 0.85 * Math.sin(a));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - h * Math.cos(a - 0.4), y1 - h * Math.sin(a - 0.4));
    ctx.lineTo(x1 - h * Math.cos(a + 0.4), y1 - h * Math.sin(a + 0.4));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function veclabel(x, y, sub, color) {
    ctx.save();
    ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 1.1;
    ctx.font = SYM;
    ctx.fillText("a", x, y);
    var w = ctx.measureText("a").width;
    ctx.font = SUB;
    ctx.fillText(sub, x + w + 0.5, y + 3.5);
    ctx.beginPath();
    ctx.moveTo(x - 0.5, y - 13); ctx.lineTo(x + w + 2, y - 13);
    ctx.moveTo(x + w - 1, y - 15.4); ctx.lineTo(x + w + 2, y - 13);
    ctx.lineTo(x + w - 1, y - 10.6);
    ctx.stroke();
    ctx.restore();
  }

  function vecWidth(sub) {
    ctx.font = SYM; var w = ctx.measureText("a").width;
    ctx.font = SUB; return w + 1.5 + ctx.measureText(sub).width;
  }

  function runWidth(parts) {
    var w = 0, i, q;
    for (i = 0; i < parts.length; i++) {
      q = parts[i];
      if (q[0] === "VEC") { w += vecWidth(q[1]); }
      else if (q[0] === "PAD") { w += q[1]; }
      else { ctx.font = q[1]; w += ctx.measureText(q[0]).width; }
    }
    return w;
  }

  function drawRuns(parts, yy, color, x0) {
    var x = (x0 === undefined) ? (W - runWidth(parts)) / 2 : x0, i, q;
    for (i = 0; i < parts.length; i++) {
      q = parts[i];
      if (q[0] === "VEC") { veclabel(x, yy, q[1], q[2] || color); x += vecWidth(q[1]); }
      else if (q[0] === "PAD") { x += q[1]; }
      else {
        ctx.font = q[1]; ctx.fillStyle = q[2] || color;
        ctx.fillText(q[0], x, yy);
        x += ctx.measureText(q[0]).width;
      }
    }
  }

  function draw() {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineJoin = "round";

    ctx.setLineDash([3, 4]);

    ctx.strokeStyle = GREY; ctx.fillStyle = GREY; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, 2 * S, 0, 6.2832); ctx.stroke();

    ctx.strokeStyle = "#6b6b6b"; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(cx, cy, pr * S, 0, 6.2832); ctx.stroke();
    ctx.setLineDash([]);
    arrow(X(-2.4), Y(0), X(2.4), Y(0), GREY, 1);
    arrow(X(0), Y(2.15), X(0), Y(-2.15), GREY, 1);
    arrow(X(0), Y(-2.15), X(0), Y(2.15), GREY, 1);
    ctx.font = SYMs;
    ctx.fillText("x", X(2.5), Y(0) + 5);
    ctx.fillText("y", X(0) - 14, Y(2.25));

    var ghosts = [20, 70, 130, 190, 250, 310];
    for (var i = 0; i < ghosts.length; i++) {

      var g = ghosts[i] * Math.PI / 180, gx = 2.0 * Math.cos(g), gy = 2.0 * Math.sin(g);
      arrow(X(gx), Y(gy), X(gx + 0.38 * Math.cos(g)), Y(gy + 0.38 * Math.sin(g)), BLUE, 2, 0.30);
      arrow(X(gx), Y(gy), X(gx - 0.38 * Math.sin(g)), Y(gy + 0.38 * Math.cos(g)), ORANGE, 2, 0.30);
    }

    var px = pr * Math.cos(pphi), py = pr * Math.sin(pphi);

    ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(px), Y(py)); ctx.stroke();
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(cx, cy, 0.5 * S, 0, -pphi, pphi > 0); ctx.stroke();

    ctx.fillStyle = INK; ctx.font = SYM;
    var mh = 0.62 * S;
    ctx.fillText("ϕ", cx + mh * Math.cos(pphi / 2) - 4, cy - mh * Math.sin(pphi / 2) + 5);
    ctx.fillText("ρ", X(px * 0.5) - 12 * Math.sin(pphi), Y(py * 0.5) - 12 * Math.cos(pphi));

    arrow(X(px), Y(py), X(px + 0.62 * Math.cos(pphi)), Y(py + 0.62 * Math.sin(pphi)), BLUE, 3.4);
    arrow(X(px), Y(py), X(px - 0.62 * Math.sin(pphi)), Y(py + 0.62 * Math.cos(pphi)), ORANGE, 3.4);
    veclabel(X(px + 0.80 * Math.cos(pphi)) - 4, Y(py + 0.80 * Math.sin(pphi)) + 5, "ρ", BLUE);
    veclabel(X(px - 0.80 * Math.sin(pphi)) - 4, Y(py + 0.80 * Math.cos(pphi)) + 5, "ϕ", ORANGE);

    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(X(px), Y(py), 4, 0, 6.2832); ctx.fill();

    ctx.strokeStyle = "#D55E00"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(X(0), Y(0), 5, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = "#D55E00"; ctx.beginPath();
    ctx.arc(X(0), Y(0), 1.8, 0, 6.2832); ctx.fill();

    var d = ((Math.round(pphi * 180 / Math.PI) % 360) + 360) % 360;
    var c = Math.cos(pphi), s = Math.sin(pphi);
    ctx.textAlign = "left";
    drawRuns([["ρ", SYM], [" = " + pr.toFixed(2) + "     ", NUM],
              ["ϕ", SYM], [" = " + d.toFixed(0) + "°", NUM]], 424, INK);

    function 삼각(f, 음수, 첫칸) {
      var q = [];
      if (첫칸) { if (음수) q.push(["−", NUM]); }
      else { q.push([음수 ? " − " : " + ", NUM]); }
      q.push([f, NUM]);
      q.push(["PAD", 2.5]);
      q.push(["ϕ ", SYM]);
      return q;
    }
    function 계수(v, 첫칸) {

      if (Math.abs(v) < 0.005) v = 0;
      var a = Math.abs(v).toFixed(2);
      if (첫칸) return (v < 0 ? "−" : "") + a + " ";
      return (v < 0 ? " − " : " + ") + a + " ";
    }

    var 식ρ = [["VEC", "ρ"], [" = ", NUM]].concat(
                삼각("cos", false, true), [["VEC", "x"]],
                삼각("sin", false, false), [["VEC", "y"]]);
    var 식ϕ = [["VEC", "ϕ"], [" = ", NUM]].concat(
                삼각("sin", true, true), [["VEC", "x"]],
                삼각("cos", false, false), [["VEC", "y"]]);

    var 값ρ = [[" = ", NUM], [계수(c, true), NUM], ["VEC", "x"],
               [계수(s, false), NUM], ["VEC", "y"]];
    var 값ϕ = [[" = ", NUM], [계수(-s, true), NUM], ["VEC", "x"],
               [계수(c, false), NUM], ["VEC", "y"]];

    var w식 = Math.max(runWidth(식ρ), runWidth(식ϕ));
    var 줄ρ = 식ρ.slice(0, 2).concat([["PAD", w식 - runWidth(식ρ)]], 식ρ.slice(2), 값ρ);
    var 줄ϕ = 식ϕ.slice(0, 2).concat([["PAD", w식 - runWidth(식ϕ)]], 식ϕ.slice(2), 값ϕ);
    var x0 = (W - Math.max(runWidth(줄ρ), runWidth(줄ϕ))) / 2;
    drawRuns(줄ρ, 456, BLUE, x0);
    drawRuns(줄ϕ, 486, ORANGE, x0);
    ctx.textAlign = "left";
  }

  function pick(ev) {
    var rc = cv.getBoundingClientRect();
    var mx = (ev.clientX - rc.left) / rc.width * W;
    var my = (ev.clientY - rc.top) / rc.height * H;
    var dx = (mx - cx) / S, dy = (cy - my) / S;
    var r = Math.sqrt(dx * dx + dy * dy);
    if (r < 0.35) return;

    var deg = Math.round(Math.atan2(dy, dx) * 180 / Math.PI);
    deg = ((deg % 360) + 360) % 360;
    pphi = deg * Math.PI / 180;
    pr = Math.round(Math.min(r, 2.0) * 100) / 100;
    draw();
  }

  var down = false;
  cv.addEventListener("pointerdown", function (e) { down = true; pick(e); e.preventDefault(); });
  cv.addEventListener("pointermove", function (e) { if (down) pick(e); });
  window.addEventListener("pointerup", function () { down = false; });

  draw();
  window.addEventListener("load", draw);
})();
</script>
</main>
<footer>© 2026 박상욱 · MAE Lab., 순천향대학교 전자공학과 · 무단 전재·재배포 금지</footer>
</body>
</html>
